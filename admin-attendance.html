<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>الحضور والغياب | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    :root {
      --sidebar-width: 260px;
      --topbar-height: 64px;
    }
    
    body {
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      font-family: var(--font-body);
    }
    
    .sidebar {
      width: var(--sidebar-width);
      background: var(--navy-deep);
      color: var(--white);
      height: 100vh;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-smooth);
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    .sidebar-header {
      padding: var(--space-xl);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    
    .sidebar-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: contain;
      background: white;
      padding: 3px;
      margin: 0 auto var(--space-md);
      display: block;
    }
    
    .sidebar-school-name {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--white);
      line-height: 1.3;
    }
    
    .sidebar-school-name small {
      display: block;
      font-weight: var(--weight-regular);
      font-size: var(--text-xs);
      opacity: 0.6;
    }
    
    .sidebar-nav {
      flex: 1;
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    
    .nav-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.35);
      padding: var(--space-md) var(--space-md) var(--space-sm);
      font-weight: var(--weight-bold);
      font-family: var(--font-numbers);
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-lg);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-weight: var(--weight-medium);
      font-size: var(--text-sm);
      transition: all var(--transition-fast);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: right;
      font-family: var(--font-body);
    }
    
    .nav-item i {
      width: 22px;
      text-align: center;
      font-size: var(--text-base);
      flex-shrink: 0;
    }
    
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
    }
    
    .nav-item.active {
      background: var(--royal);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(30, 95, 187, 0.4);
    }
    
    .nav-item.danger:hover {
      background: var(--red);
      color: var(--white);
    }
    
    .sidebar-footer {
      padding: var(--space-lg);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .admin-info {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }
    
    .admin-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--royal);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--weight-bold);
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      flex-shrink: 0;
    }
    
    .admin-details {
      flex: 1;
      min-width: 0;
    }
    
    .admin-details .name {
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .admin-details .role {
      font-size: 11px;
      opacity: 0.6;
    }
    
    .main-wrapper {
      flex: 1;
      margin-right: var(--sidebar-width);
      min-height: 100vh;
    }
    
    .topbar {
      background: var(--white);
      height: var(--topbar-height);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-2xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-xs);
    }
    
    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }
    
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--ink);
      cursor: pointer;
      padding: var(--space-sm);
    }
    
    .page-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .topbar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--soft);
      border: none;
      color: var(--body);
      cursor: pointer;
      font-size: var(--text-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      position: relative;
    }
    
    .topbar-btn:hover {
      background: var(--royal-light);
      color: var(--royal);
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      display: none;
    }
    
    .sidebar-overlay.open {
      display: block;
    }
    
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
      .main-wrapper {
        margin-right: 0;
      }
    }

    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2xl);
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-2xl);
      color: var(--navy-deep);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      border-radius: var(--radius-full);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      font-family: var(--font-body);
    }
    
    .btn-primary {
      background: var(--royal);
      color: var(--white);
      box-shadow: var(--shadow-btn-blue);
    }
    
    .btn-primary:hover {
      background: var(--royal-hover);
      transform: translateY(-2px);
    }
    
    .btn-success {
      background: var(--success);
      color: var(--white);
    }
    
    .btn-success:hover {
      background: var(--success-hover);
      transform: translateY(-2px);
    }
    
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: var(--space-xl);
      overflow: hidden;
    }
    
    .card-header {
      padding: var(--space-lg) var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    
    .card-header h3 {
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-md);
      color: var(--ink);
    }
    
    .card-body {
      padding: var(--space-xl);
    }
    
    .form-group {
      margin-bottom: var(--space-lg);
    }
    
    .form-group label {
      display: block;
      font-family: var(--font-heading);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      color: var(--ink);
      margin-bottom: var(--space-sm);
    }
    
    .form-input, .form-select {
      width: 100%;
      padding: var(--space-md) var(--space-lg);
      background: var(--soft);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--ink);
      transition: all var(--transition-base);
    }
    
    .form-input:focus, .form-select:focus {
      border-color: var(--border-focus);
      background: var(--white);
      box-shadow: var(--shadow-input-focus);
      outline: none;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-lg);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    table th {
      background: var(--soft);
      padding: var(--space-md);
      text-align: right;
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-xs);
      color: var(--body-light);
      border-bottom: 2px solid var(--border);
    }
    
    table td {
      padding: var(--space-md);
      border-bottom: 1px solid var(--border-light);
      font-size: var(--text-sm);
      color: var(--ink);
    }
    
    table tr:hover td {
      background: var(--royal-light);
    }
    
    .status-radio {
      display: flex;
      gap: var(--space-md);
    }
    
    .status-radio label {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      cursor: pointer;
      font-size: var(--text-sm);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      border: 2px solid var(--border);
      transition: all var(--transition-fast);
    }
    
    .status-radio label:hover {
      border-color: var(--royal);
    }
    
    .status-radio label.active-present {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }
    
    .status-radio label.active-absent {
      background: var(--red-light);
      border-color: var(--red);
      color: var(--red);
    }
    
    .status-radio label.active-late {
      background: var(--warning-bg);
      border-color: var(--warning);
      color: var(--warning);
    }
    
    .status-radio input {
      display: none;
    }
    
    .badge {
      display: inline-block;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--weight-bold);
    }
    
    .badge-present { background: var(--success-bg); color: var(--success); }
    .badge-absent { background: var(--red-light); color: var(--red); }
    .badge-late { background: var(--warning-bg); color: var(--warning); }
    
    .summary-row {
      display: flex;
      gap: var(--space-xl);
      margin-bottom: var(--space-xl);
      flex-wrap: wrap;
    }
    
    .summary-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
    }
    
    .summary-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    
    .summary-dot.present { background: var(--success); }
    .summary-dot.absent { background: var(--red); }
    .summary-dot.late { background: var(--warning); }
    
    .empty-state {
      text-align: center;
      padding: var(--space-3xl);
      color: var(--mute);
    }
    
    .empty-state i {
      font-size: 40px;
      margin-bottom: var(--space-md);
      display: block;
    }
    
    @media (max-width: 600px) {
      .page-container { padding: var(--space-md); }
      .page-header h1 { font-size: var(--text-xl); }
      .form-row { grid-template-columns: 1fr; }
      .status-radio { flex-direction: column; gap: var(--space-sm); }
    }
  </style>
</head>
<body>

      <button class="nav-item danger" onclick="window.location.href='admin-login.html'" style="width:100%;">

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="page-title" id="pageTitle">الحضور والغياب</h1>
      </div>
      <div class="topbar-right">
        <a href="admin-dashboard.html" class="topbar-btn" title="الرئيسية">
          <i class="fas fa-home"></i>
        </a>
      </div>
    </header>
    
    <div style="padding:var(--space-2xl);flex:1;" id="contentArea">
        <div class="page-header">
          <h1>✅ الحضور والغياب</h1>
        </div>
        
        <div class="card">
          <div class="card-header">
            <h3>اختر الفصل والتاريخ</h3>
          </div>
          <div class="card-body">
            <div class="form-row">
              <div class="form-group">
                <label>المرحلة</label>
                <select class="form-select" id="stageSelect">
                  <option value="">اختر المرحلة</option>
                </select>
              </div>
              <div class="form-group">
                <label>الفصل</label>
                <select class="form-select" id="classSelect">
                  <option value="">اختر الفصل أولاً</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>التاريخ</label>
              <input type="date" class="form-input" id="attendanceDate">
            </div>
            <button class="btn btn-primary" id="btnLoadAttendance">
              <i class="fas fa-search"></i> عرض قائمة الطلاب
            </button>
          </div>
        </div>
        
        <div id="attendanceContainer"></div>
    </div>
  </div>
  
  <script type="module">
    // [FIX] Import runTransaction directly from Firebase SDK
    import { runTransaction } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
    import { adminAttendance } from './js/admin-attendance.js';
    import { adminStages } from './js/admin-stages.js';
    import { showToast, formatDateArabic, escapeHtml } from './js/utils.js';
    
    // دوال تعقيم احتياطية
    const safeEscapeHtml = (str) => {
      if (typeof escapeHtml === 'function') return escapeHtml(str);
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };
    
    const escapeAttr = (str) => {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    
    const stageSelect = document.getElementById('stageSelect');
    const classSelect = document.getElementById('classSelect');
    const attendanceDate = document.getElementById('attendanceDate');
    const btnLoadAttendance = document.getElementById('btnLoadAttendance');
    const attendanceContainer = document.getElementById('attendanceContainer');
    
    attendanceDate.value = new Date().toISOString().split('T')[0];
    
    async function init() {
      try {
        const stages = await adminStages.getStages();
        stageSelect.innerHTML = '<option value="">اختر المرحلة</option>' + 
          stages.map(s => `<option value="${escapeAttr(s.id)}">${safeEscapeHtml(s.name)}</option>`).join('');
      } catch (e) {
        showToast('فشل تحميل المراحل', 'error');
      }
      
      stageSelect.addEventListener('change', async () => {
        classSelect.innerHTML = '<option value="">اختر الفصل</option>';
        if (!stageSelect.value) return;
        
        try {
          const classes = await adminStages.getClasses(stageSelect.value);
          classSelect.innerHTML = '<option value="">اختر الفصل</option>' + 
            classes.map(c => `<option value="${escapeAttr(c.id)}">${safeEscapeHtml(c.name)}</option>`).join('');
        } catch (e) {
          showToast('فشل تحميل الفصول', 'error');
        }
      });
      
      btnLoadAttendance.addEventListener('click', loadAttendance);
    }
    
    async function loadAttendance() {
      const classId = classSelect.value;
      const date = attendanceDate.value;
      
      if (!classId) return showToast('اختر الفصل', 'warning');
      if (!date) return showToast('اختر التاريخ', 'warning');
      
      btnLoadAttendance.disabled = true;
      btnLoadAttendance.innerHTML = '<span class="spinner spinner-sm"></span> جاري التحميل...';
      
      try {
        const attendanceList = await adminAttendance.getClassAttendance(classId, date);
        
        if (attendanceList.length === 0) {
          attendanceContainer.innerHTML = `
            <div class="card">
              <div class="card-body">
                <div class="empty-state">
                  <i class="fas fa-user-graduate"></i>
                  <p>لا يوجد طلاب في هذا الفصل.</p>
                </div>
              </div>
            </div>
          `;
          return;
        }
        
        const presentCount = attendanceList.filter(a => a.status === 'present').length;
        const absentCount = attendanceList.filter(a => a.status === 'absent').length;
        const lateCount = attendanceList.filter(a => a.status === 'late').length;
        const safeDateFormatted = safeEscapeHtml(formatDateArabic(new Date(date)));
        
        attendanceContainer.innerHTML = `
          <div class="card">
            <div class="card-header">
              <h3>📋 تسجيل الحضور - ${safeDateFormatted}</h3>
              <button class="btn btn-success" id="btnSaveAttendance">
                <i class="fas fa-save"></i> حفظ الحضور
              </button>
            </div>
            <div class="card-body">
              <div class="summary-row">
                <span class="summary-item">
                  <span class="summary-dot present"></span> حضور: ${presentCount}
                </span>
                <span class="summary-item">
                  <span class="summary-dot absent"></span> غياب: ${absentCount}
                </span>
                <span class="summary-item">
                  <span class="summary-dot late"></span> تأخير: ${lateCount}
                </span>
              </div>
              
              <div style="overflow-x:auto;">
                <table>
                  <thead>
                    <tr>
                      <th>الكود</th>
                      <th>الاسم</th>
                      <th>الحالة</th>
                      <th>ملاحظة</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${attendanceList.map((record, index) => {
                      const safeCode = safeEscapeHtml(record.studentCode || '—');
                      const safeName = safeEscapeHtml(record.studentName || '—');
                      const safeNote = escapeAttr(record.note || '');
                      
                      return `
                      <tr>
                        <td style="font-family:var(--font-numbers);">${safeCode}</td>
                        <td><strong>${safeName}</strong></td>
                        <td>
                          <div class="status-radio" data-index="${index}">
                            <label class="${record.status === 'present' ? 'active-present' : ''}" data-status="present">
                              <input type="radio" name="status-${index}" value="present" ${record.status === 'present' ? 'checked' : ''}> حاضر
                            </label>
                            <label class="${record.status === 'absent' ? 'active-absent' : ''}" data-status="absent">
                              <input type="radio" name="status-${index}" value="absent" ${record.status === 'absent' ? 'checked' : ''}> غائب
                            </label>
                            <label class="${record.status === 'late' ? 'active-late' : ''}" data-status="late">
                              <input type="radio" name="status-${index}" value="late" ${record.status === 'late' ? 'checked' : ''}> متأخر
                            </label>
                          </div>
                        </td>
                        <td>
                          <input type="text" class="form-input" style="width:120px;padding:var(--space-xs) var(--space-sm);font-size:var(--text-xs);" 
                            placeholder="ملاحظة" value="${safeNote}" data-index="${index}">
                        </td>
                      </tr>
                    `}).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
        
        document.querySelectorAll('.status-radio label').forEach(label => {
          label.addEventListener('click', function() {
            const parent = this.parentElement;
            parent.querySelectorAll('label').forEach(l => {
              l.classList.remove('active-present', 'active-absent', 'active-late');
            });
            
            const status = this.dataset.status;
            if (status === 'present') this.classList.add('active-present');
            else if (status === 'absent') this.classList.add('active-absent');
            else if (status === 'late') this.classList.add('active-late');
            
            this.querySelector('input').checked = true;
          });
        });
        
        document.getElementById('btnSaveAttendance').addEventListener('click', async () => {
          const saveData = attendanceList.map((record, index) => {
            const radio = document.querySelector(`input[name="status-${index}"]:checked`);
            const noteInput = document.querySelector(`input[data-index="${index}"]`);
            
            return {
              studentId: record.studentId,
              status: radio?.value || 'present',
              note: noteInput?.value?.trim() || ''
            };
          });
          
          try {
            // [FIX] Pass runTransaction to the function
            await adminAttendance.saveAttendance(classId, saveData, date, runTransaction);
          } catch (error) {
            showToast(error.message, 'error');
          }
        });
        
      } catch (error) {
        attendanceContainer.innerHTML = `
          <div class="card"><div class="card-body"><p style="color:var(--red);text-align:center;">فشل تحميل بيانات الحضور</p></div></div>
        `;
      } finally {
        btnLoadAttendance.disabled = false;
        btnLoadAttendance.innerHTML = '<i class="fas fa-search"></i> عرض قائمة الطلاب';
      }
    }
    
    init();
  </script>
</body>
</html>
