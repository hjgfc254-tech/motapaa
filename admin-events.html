<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>الأحداث | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    :root {
      --sidebar-width: 260px;
      --topbar-height: 64px;
    }
    
    body {
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      font-family: var(--font-body);
    }
    
    .sidebar {
      width: var(--sidebar-width);
      background: var(--navy-deep);
      color: var(--white);
      height: 100vh;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-smooth);
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    .sidebar-header {
      padding: var(--space-xl);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    
    .sidebar-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: contain;
      background: white;
      padding: 3px;
      margin: 0 auto var(--space-md);
      display: block;
    }
    
    .sidebar-school-name {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--white);
      line-height: 1.3;
    }
    
    .sidebar-school-name small {
      display: block;
      font-weight: var(--weight-regular);
      font-size: var(--text-xs);
      opacity: 0.6;
    }
    
    .sidebar-nav {
      flex: 1;
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    
    .nav-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.35);
      padding: var(--space-md) var(--space-md) var(--space-sm);
      font-weight: var(--weight-bold);
      font-family: var(--font-numbers);
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-lg);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-weight: var(--weight-medium);
      font-size: var(--text-sm);
      transition: all var(--transition-fast);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: right;
      font-family: var(--font-body);
    }
    
    .nav-item i {
      width: 22px;
      text-align: center;
      font-size: var(--text-base);
      flex-shrink: 0;
    }
    
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
    }
    
    .nav-item.active {
      background: var(--royal);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(30, 95, 187, 0.4);
    }
    
    .nav-item.danger:hover {
      background: var(--red);
      color: var(--white);
    }
    
    .sidebar-footer {
      padding: var(--space-lg);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .admin-info {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }
    
    .admin-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--royal);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--weight-bold);
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      flex-shrink: 0;
    }
    
    .admin-details {
      flex: 1;
      min-width: 0;
    }
    
    .admin-details .name {
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .admin-details .role {
      font-size: 11px;
      opacity: 0.6;
    }
    
    .main-wrapper {
      flex: 1;
      margin-right: var(--sidebar-width);
      min-height: 100vh;
    }
    
    .topbar {
      background: var(--white);
      height: var(--topbar-height);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-2xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-xs);
    }
    
    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }
    
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--ink);
      cursor: pointer;
      padding: var(--space-sm);
    }
    
    .page-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .topbar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--soft);
      border: none;
      color: var(--body);
      cursor: pointer;
      font-size: var(--text-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      position: relative;
    }
    
    .topbar-btn:hover {
      background: var(--royal-light);
      color: var(--royal);
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      display: none;
    }
    
    .sidebar-overlay.open {
      display: block;
    }
    
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
      .main-wrapper {
        margin-right: 0;
      }
    }

    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2xl);
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-2xl);
      color: var(--navy-deep);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      border-radius: var(--radius-full);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      font-family: var(--font-body);
    }
    
    .btn-primary {
      background: var(--warning);
      color: var(--white);
    }
    
    .btn-primary:hover {
      background: var(--warning-hover);
      transform: translateY(-2px);
    }
    
    .btn-outline {
      background: var(--white);
      border: 2px solid var(--border);
      color: var(--body);
    }
    
    .btn-outline:hover {
      border-color: var(--royal);
      color: var(--royal);
    }
    
    .btn-danger {
      background: var(--red);
      color: var(--white);
    }
    
    .btn-danger:hover {
      background: var(--red-hover);
    }
    
    .btn-sm {
      padding: var(--space-xs) var(--space-md);
      font-size: var(--text-xs);
    }
    
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: var(--space-lg);
      overflow: hidden;
    }
    
    .card-header {
      padding: var(--space-lg) var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-md);
    }
    
    .card-body {
      padding: var(--space-xl);
    }
    
    .card-footer {
      padding: var(--space-md) var(--space-xl);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    
    .badge {
      display: inline-block;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--weight-bold);
      white-space: nowrap;
    }
    
    .badge-trip { background: var(--royal-light); color: var(--royal); }
    .badge-celebration { background: var(--red-light); color: var(--red); }
    .badge-competition { background: var(--warning-bg); color: var(--warning); }
    .badge-honor { background: var(--success-bg); color: var(--success); }
    .badge-activity { background: var(--info-bg); color: var(--info); }
    
    .event-body {
      font-size: var(--text-sm);
      color: var(--body);
      line-height: var(--leading-relaxed);
    }
    
    .filter-tabs {
      display: flex;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
      flex-wrap: wrap;
    }
    
    .filter-tab {
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--radius-full);
      font-weight: var(--weight-bold);
      font-size: var(--text-xs);
      border: 2px solid var(--border);
      background: var(--white);
      color: var(--body);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .filter-tab:hover {
      border-color: var(--royal);
      color: var(--royal);
    }
    
    .filter-tab.active {
      background: var(--royal);
      color: var(--white);
      border-color: var(--royal);
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 38, 71, 0.5);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      animation: fadeIn 0.2s ease;
    }
    
    .modal {
      background: var(--white);
      border-radius: var(--radius-2xl);
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-3xl);
      animation: slideUp 0.3s ease;
    }
    
    .modal-header {
      padding: var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-header h3 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--soft);
      border: none;
      color: var(--body);
      cursor: pointer;
      font-size: var(--text-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-close:hover {
      background: var(--red-light);
      color: var(--red);
    }
    
    .modal-body {
      padding: var(--space-xl);
    }
    
    .modal-footer {
      padding: var(--space-lg) var(--space-xl);
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: var(--space-md);
      justify-content: flex-end;
    }
    
    .form-group {
      margin-bottom: var(--space-lg);
    }
    
    .form-group label {
      display: block;
      font-family: var(--font-heading);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      color: var(--ink);
      margin-bottom: var(--space-sm);
    }
    
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: var(--space-md) var(--space-lg);
      background: var(--soft);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--ink);
      transition: all var(--transition-base);
    }
    
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--border-focus);
      background: var(--white);
      box-shadow: var(--shadow-input-focus);
      outline: none;
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-3xl);
      color: var(--mute);
    }
    
    .empty-state i {
      font-size: 40px;
      margin-bottom: var(--space-md);
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 600px) {
      .page-container { padding: var(--space-md); }
      .page-header h1 { font-size: var(--text-xl); }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="document.getElementById('sidebar').classList.remove('open');this.classList.remove('open');"></div>
  
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="elgeel.png" alt="الشعار" class="sidebar-logo" onerror="this.style.display='none'">
      <div class="sidebar-school-name">
        مدارس الجيل الجديد
        <small>الخاصة</small>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <div class="nav-section-title">الرئيسية</div>

      </a>
      
      <div class="nav-section-title">التواصل</div>
      <a class="nav-item" href="admin-announcements.html">
        <i class="fas fa-bullhorn"></i> الإعلانات
      </a>
      <a class="nav-item" href="admin-messages.html">
        <i class="fas fa-message"></i> الرسائل
      </a>
      
      <div class="nav-section-title">المحتوى</div>
      <a class="nav-item active" href="admin-events.html">
        <i class="fas fa-calendar-star"></i> الأحداث
      </a>
      <a class="nav-item" href="admin-gallery.html">
        <i class="fas fa-images"></i> معرض الصور
      </a>
      <a class="nav-item" href="admin-schedules.html">
        <i class="fas fa-calendar-week"></i> جداول الحصص
      </a>
      
      <div class="nav-section-title">المالية</div>
      <a class="nav-item" href="admin-expenses.html">
        <i class="fas fa-receipt"></i> المصروفات
      </a>
      <a class="nav-item" href="admin-attendance.html">

      </a>
      
      <div class="nav-section-title">النظام</div>
      <a class="nav-item" href="admin-settings.html">
        <i class="fas fa-gear"></i> الإعدادات
      </a>
      <a class="nav-item" href="admin-logs.html">
        <i class="fas fa-clock-rotate-left"></i> سجل العمليات
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <div class="admin-info">
        <div class="admin-avatar" id="adminAvatar">م</div>
        <div class="admin-details">
          <div class="name" id="adminName">المشرف</div>
          <div class="role" id="adminRole">مدير عام</div>
        </div>
      </div>
      <button class="nav-item danger" onclick="window.location.href='admin-login.html'" style="width:100%;">
        <i class="fas fa-right-from-bracket"></i> تسجيل الخروج
      </button>
    </div>
  </aside>
  
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="page-title" id="pageTitle">الأحداث والأنشطة</h1>
      </div>
      <div class="topbar-right">
        <a href="admin-dashboard.html" class="topbar-btn" title="الرئيسية">
          <i class="fas fa-home"></i>
        </a>
      </div>
    </header>
    
    <div style="padding:var(--space-2xl);flex:1;" id="contentArea">
        <div class="page-header">
          <h1>🎉 الأحداث والأنشطة</h1>
          <button class="btn btn-primary" id="btnCreate">
            <i class="fas fa-calendar-plus"></i> إضافة حدث
          </button>
        </div>
        
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-filter="all">الكل</button>
          <button class="filter-tab" data-filter="trip">رحلات</button>
          <button class="filter-tab" data-filter="celebration">احتفالات</button>
          <button class="filter-tab" data-filter="competition">مسابقات</button>
          <button class="filter-tab" data-filter="honor">تكريم</button>
          <button class="filter-tab" data-filter="activity">أنشطة</button>
        </div>
        
        <div id="eventsContainer"></div>
    </div>
  </div>
  
  <script type="module">
    import { adminEvents } from './js/admin-events.js';
    import { showToast, showConfirm, formatDateArabic, timeAgoArabic, escapeHtml } from './js/utils.js';
    
    // دوال تعقيم احتياطية
    const safeEscapeHtml = (str) => {
      if (typeof escapeHtml === 'function') return escapeHtml(str);
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };
    
    const escapeAttr = (str) => {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    
    const eventsContainer = document.getElementById('eventsContainer');
    const btnCreate = document.getElementById('btnCreate');
    const filterTabs = document.getElementById('filterTabs');
    
    const TYPE_LABELS = {
      trip: 'رحلة',
      celebration: 'احتفال',
      competition: 'مسابقة',
      honor: 'تكريم',
      activity: 'نشاط'
    };
    
    const TYPE_ICONS = {
      trip: 'fa-bus',
      celebration: 'fa-cake-candles',
      competition: 'fa-trophy',
      honor: 'fa-medal',
      activity: 'fa-puzzle-piece'
    };
    
    async function init() {
      filterTabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.filter-tab');
        if (!tab) return;
        filterTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        adminEvents.currentFilter = tab.dataset.filter;
        adminEvents.resetFilters();
        loadEvents();
      });
      
      loadEvents();
    }
    
    async function loadEvents() {
      try {
        const result = await adminEvents.getEvents();
        const events = result.events || [];
        
        if (events.length === 0) {
          eventsContainer.innerHTML = `
            <div class="card">
              <div class="card-body">
                <div class="empty-state">
                  <i class="fas fa-calendar-xmark"></i>
                  <p>لا توجد أحداث. ابدأ بإضافة أول حدث.</p>
                </div>
              </div>
            </div>
          `;
          return;
        }
        
        eventsContainer.innerHTML = events.map(event => {
          const type = event.type || 'activity';
          const eventDate = event.event_date?.toDate ? event.event_date.toDate() : new Date(event.event_date);
          
          // تعقيم جميع البيانات القادمة من قاعدة البيانات
          const safeTitle = safeEscapeHtml(event.title || 'حدث');
          const safeDescription = safeEscapeHtml(event.description || '');
          const safeAttrId = escapeAttr(event.id || '');
          const safeAttrTitle = escapeAttr(event.title || 'حدث');
          
          return `
            <div class="card">
              <div class="card-header">
                <div style="flex:1;">
                  <h3 style="font-family:var(--font-heading);font-weight:var(--weight-bold);font-size:var(--text-md);color:var(--ink);margin-bottom:4px;">
                    ${safeTitle}
                  </h3>
                  <span class="badge badge-${type}">
                    <i class="fas ${TYPE_ICONS[type]}"></i> ${TYPE_LABELS[type]}
                  </span>
                </div>
                <div style="display:flex;gap:8px;">
                  <button class="btn btn-outline btn-sm btnEdit" data-id="${safeAttrId}">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button class="btn btn-danger btn-sm btnDelete" data-id="${safeAttrId}" data-title="${safeAttrTitle}">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
              <div class="card-body">
                ${safeDescription ? `<div class="event-body">${safeDescription}</div>` : ''}
              </div>
              <div class="card-footer">
                <span style="font-size:var(--text-xs);color:var(--mute);">
                  <i class="fas fa-calendar"></i> ${safeEscapeHtml(formatDateArabic(eventDate))}
                </span>
                <span style="font-size:var(--text-xs);color:var(--body-light);">
                  ${event.target === 'all' ? '🌐 لجميع الطلاب' : '📌 فئة محددة'}
                </span>
              </div>
            </div>
          `;
        }).join('');
        
        attachEvents();
        
      } catch (error) {
        eventsContainer.innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--red);text-align:center;">فشل تحميل الأحداث</p></div></div>`;
      }
    }
    
    function attachEvents() {
      document.querySelectorAll('.btnEdit').forEach(btn => {
        btn.addEventListener('click', () => showEventModal(btn.dataset.id));
      });
      
      document.querySelectorAll('.btnDelete').forEach(btn => {
        btn.addEventListener('click', async () => {
          const safeTitle = btn.dataset.title || 'هذا الحدث';
          const confirmed = await showConfirm(`حذف حدث "${safeTitle}"؟`, 'تأكيد');
          if (confirmed) {
            await adminEvents.deleteEvent(btn.dataset.id);
            loadEvents();
          }
        });
      });
    }
    
    async function showEventModal(eventId = null) {
      const isEdit = !!eventId;
      let event = null;
      
      if (isEdit) {
        event = await adminEvents.getEvent(eventId);
        if (!event) return showToast('الحدث غير موجود', 'error');
      }
      
      const eventDate = event?.event_date?.toDate ? event.event_date.toDate() : new Date();
      const dateStr = eventDate.toISOString().split('T')[0];
      
      // تعقيم القيم لإدراجها في HTML attributes
      const safeTitle = escapeAttr(event?.title || '');
      const safeDescription = escapeAttr(event?.description || '');
      
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>${isEdit ? 'تعديل حدث' : 'إضافة حدث جديد'}</h3>
            <button class="modal-close"><i class="fas fa-times"></i></button>
          </div>
          <form id="eventForm">
            <div class="modal-body">
              <div class="form-group">
                <label>اسم الحدث *</label>
                <input type="text" class="form-input" id="eTitle" value="${safeTitle}" required>
              </div>
              <div class="form-group">
                <label>النوع</label>
                <select class="form-select" id="eType">
                  <option value="activity" ${event?.type === 'activity' ? 'selected' : ''}>نشاط</option>
                  <option value="trip" ${event?.type === 'trip' ? 'selected' : ''}>رحلة</option>
                  <option value="celebration" ${event?.type === 'celebration' ? 'selected' : ''}>احتفال</option>
                  <option value="competition" ${event?.type === 'competition' ? 'selected' : ''}>مسابقة</option>
                  <option value="honor" ${event?.type === 'honor' ? 'selected' : ''}>تكريم</option>
                </select>
              </div>
              <div class="form-group">
                <label>التاريخ *</label>
                <input type="date" class="form-input" id="eDate" value="${dateStr}" required>
              </div>
              <div class="form-group">
                <label>الوصف</label>
                <textarea class="form-textarea" id="eDescription" placeholder="وصف الحدث...">${safeDescription}</textarea>
              </div>
              <div class="form-group">
                <label>الفئة المستهدفة</label>
                <select class="form-select" id="eTarget">
                  <option value="all" ${event?.target === 'all' ? 'selected' : ''}>جميع الطلاب</option>
                  <option value="stage" ${event?.target === 'stage' ? 'selected' : ''}>مرحلة محددة</option>
                  <option value="class" ${event?.target === 'class' ? 'selected' : ''}>فصل محدد</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline close-modal">إلغاء</button>
              <button type="submit" class="btn btn-primary">${isEdit ? 'تحديث' : 'إضافة'}</button>
            </div>
          </form>
        </div>
      `;
      
      document.body.appendChild(overlay);
      
      const closeModal = () => overlay.remove();
      overlay.querySelector('.modal-close').addEventListener('click', closeModal);
      overlay.querySelector('.close-modal').addEventListener('click', closeModal);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
      
      overlay.querySelector('#eventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const title = overlay.querySelector('#eTitle').value.trim();
        const type = overlay.querySelector('#eType').value;
        const date = overlay.querySelector('#eDate').value;
        const description = overlay.querySelector('#eDescription').value.trim();
        const target = overlay.querySelector('#eTarget').value;
        
        if (!title) return showToast('اسم الحدث مطلوب', 'warning');
        if (!date) return showToast('التاريخ مطلوب', 'warning');
        
        const data = {
          title,
          type,
          event_date: new Date(date).toISOString(),
          description,
          target,
          target_ids: [],
          target_labels: []
        };
        
        try {
          if (isEdit) {
            await adminEvents.updateEvent(eventId, data);
          } else {
            await adminEvents.createEvent(data);
          }
          closeModal();
          loadEvents();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    }
    
    btnCreate.addEventListener('click', () => showEventModal());
    
    init();
  </script>
</body>
</html>
