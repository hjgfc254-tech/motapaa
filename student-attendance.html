<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description" content="الحضور والغياب - مدارس الجيل الجديد الخاصة">
  <meta name="theme-color" content="#0A2647">
  <title>الحضور والغياب | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    body {
      background: var(--page-bg);
      min-height: 100vh;
    }
    
    .top-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border-light);
      padding: var(--space-md) var(--space-xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    
    .top-bar-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .back-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--royal);
      text-decoration: none;
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      transition: color var(--transition-fast);
    }
    
    .back-btn:hover {
      color: var(--navy);
    }
    
    .page-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .page-header i {
      color: var(--success);
      font-size: var(--text-xl);
    }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .main-content {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    /* بطاقات الإحصائيات */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--space-md);
      margin-bottom: var(--space-2xl);
    }
    
    .stat-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      text-align: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: all var(--transition-base);
    }
    
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    
    .stat-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin: 0 auto var(--space-md);
    }
    
    .stat-card-icon.present { background: var(--success-bg); color: var(--success); }
    .stat-card-icon.absent { background: var(--red-light); color: var(--red); }
    .stat-card-icon.late { background: var(--warning-bg); color: var(--warning); }
    .stat-card-icon.total { background: var(--royal-light); color: var(--royal); }
    
    .stat-value {
      font-family: var(--font-numbers);
      font-weight: var(--weight-bold);
      font-size: var(--text-3xl);
      color: var(--ink);
      line-height: 1;
    }
    
    .stat-label {
      font-size: var(--text-xs);
      color: var(--body-light);
      margin-top: var(--space-sm);
    }
    
    .stat-percent {
      font-family: var(--font-numbers);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      margin-top: var(--space-xs);
    }
    
    .stat-percent.good { color: var(--success); }
    .stat-percent.warning { color: var(--warning); }
    .stat-percent.danger { color: var(--red); }
    
    /* شريط التقدم */
    .progress-section {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      margin-bottom: var(--space-2xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }
    
    .progress-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      color: var(--ink);
      margin-bottom: var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    
    .progress-bar-container {
      height: 12px;
      background: var(--soft);
      border-radius: var(--radius-full);
      overflow: hidden;
      display: flex;
      margin-bottom: var(--space-md);
    }
    
    .progress-segment {
      height: 100%;
      transition: width var(--transition-smooth);
    }
    
    .progress-segment.present { background: var(--success); }
    .progress-segment.absent { background: var(--red); }
    .progress-segment.late { background: var(--warning); }
    
    .progress-legend {
      display: flex;
      gap: var(--space-xl);
      flex-wrap: wrap;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-xs);
      color: var(--body);
    }
    
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }
    
    .legend-dot.present { background: var(--success); }
    .legend-dot.absent { background: var(--red); }
    .legend-dot.late { background: var(--warning); }
    
    /* سجل الحضور */
    .records-section {
      background: var(--white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }
    
    .records-header {
      padding: var(--space-lg) var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .records-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-md);
      color: var(--navy-deep);
    }
    
    .records-list {
      max-height: 500px;
      overflow-y: auto;
    }
    
    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition-fast);
    }
    
    .record-item:last-child {
      border-bottom: none;
    }
    
    .record-item:hover {
      background: var(--soft);
    }
    
    .record-date {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .record-day-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .record-day-icon.present { background: var(--success-bg); color: var(--success); }
    .record-day-icon.absent { background: var(--red-light); color: var(--red); }
    .record-day-icon.late { background: var(--warning-bg); color: var(--warning); }
    
    .record-date-text {
      font-size: var(--text-sm);
      color: var(--ink);
      font-weight: var(--weight-medium);
    }
    
    .record-day-name {
      font-size: var(--text-xs);
      color: var(--body-light);
    }
    
    .record-status {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .status-badge {
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: var(--weight-bold);
      font-family: var(--font-numbers);
    }
    
    .status-badge.present { background: var(--success-bg); color: var(--success); }
    .status-badge.absent { background: var(--red-light); color: var(--red); }
    .status-badge.late { background: var(--warning-bg); color: var(--warning); }
    
    .record-note {
      font-size: var(--text-xs);
      color: var(--mute);
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    /* حالات التحميل والفارغ */
    .loading-state {
      text-align: center;
      padding: var(--space-5xl);
    }
    
    .loading-state .spinner {
      margin: 0 auto var(--space-lg);
      width: 40px;
      height: 40px;
      border-width: 4px;
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-5xl);
    }
    
    .empty-state i {
      font-size: 56px;
      color: var(--mute-light);
      margin-bottom: var(--space-lg);
      display: block;
    }
    
    .empty-state h3 {
      font-family: var(--font-heading);
      color: var(--ink);
      margin-bottom: var(--space-sm);
    }
    
    .empty-state p {
      color: var(--body-light);
      font-size: var(--text-sm);
    }
    
    @media (max-width: 600px) {
      .top-bar {
        padding: var(--space-sm) var(--space-md);
      }
      
      .main-content {
        padding: var(--space-md);
      }
      
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-sm);
      }
      
      .stat-card {
        padding: var(--space-lg);
      }
      
      .stat-value {
        font-size: var(--text-2xl);
      }
      
      .record-item {
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
        align-items: flex-start;
      }
      
      .record-status {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="student-dashboard.html" class="back-btn">
        <i class="fas fa-arrow-right"></i>
        العودة للوحة المتابعة
      </a>
      <div class="page-header">
        <h1>الحضور والغياب</h1>
        <i class="fas fa-clipboard-check"></i>
      </div>
    </div>
  </header>
  
  <main class="main-content">
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>جاري تحميل بيانات الحضور...</p>
    </div>
    
    <div id="emptyState" class="empty-state" style="display:none;">
      <i class="fas fa-clipboard"></i>
      <h3>لا توجد بيانات حضور</h3>
      <p>لم يتم تسجيل بيانات الحضور بعد للعام الدراسي الحالي.</p>
    </div>
    
    <div id="attendanceContent" style="display:none;">
      <!-- الإحصائيات -->
      <div class="stats-row" id="statsRow"></div>
      
      <!-- شريط التقدم -->
      <div class="progress-section" id="progressSection"></div>
      
      <!-- سجل الحضور -->
      <div class="records-section">
        <div class="records-header">
          <h3 class="records-title">سجل الحضور</h3>
          <span style="font-size:var(--text-xs);color:var(--mute);">
            <i class="fas fa-info-circle"></i> آخر 30 يوم
          </span>
        </div>
        <div class="records-list" id="recordsList"></div>
      </div>
    </div>
  </main>
  
  <script type="module">
    import { authManager } from './js/auth-system.js';
    import { fetchDocument, fetchDocuments } from './js/firebase-config.js';
    import { getCachedData, CACHE_CONFIG } from './js/cache-manager.js';
    import { formatDateArabic, escapeHtml } from './js/utils.js';
    
    // دالة تعقيم احتياطية
    const safeEscapeHtml = (str) => {
      if (typeof escapeHtml === 'function') return escapeHtml(str);
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };
    
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const attendanceContent = document.getElementById('attendanceContent');
    const statsRow = document.getElementById('statsRow');
    const progressSection = document.getElementById('progressSection');
    const recordsList = document.getElementById('recordsList');
    
    const DAY_NAMES = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    
    let currentStudent = null;
    let _cachedAcademicYear = null;
    
    // ===========================
    // جلب السنة الدراسية ديناميكياً
    // ===========================
    async function getAcademicYear() {
      if (_cachedAcademicYear) return _cachedAcademicYear;
      
      try {
        const settings = await fetchDocument('settings', 'general');
        if (settings && settings.current_academic_year) {
          _cachedAcademicYear = settings.current_academic_year.replace(/-/g, '_');
          return _cachedAcademicYear;
        }
      } catch (error) {
        console.warn('⚠️ فشل جلب السنة الدراسية:', error.message);
      }
      
      _cachedAcademicYear = '2025_2026';
      return _cachedAcademicYear;
    }
    
    // ===========================
    // التهيئة
    // ===========================
    async function initPage() {
      try {
        const session = await authManager.initialize();
        
        if (!session.isAuthenticated || session.type !== 'student') {
          window.location.href = 'index.html';
          return;
        }
        
        currentStudent = session.user;
        await loadAttendance();
        
      } catch (error) {
        console.error('❌ فشل تحميل الصفحة:', error);
        showEmptyState('حدث خطأ في تحميل بيانات الحضور. يرجى المحاولة لاحقاً.');
      }
    }
    
    // ===========================
    // تحميل بيانات الحضور
    // ===========================
    async function loadAttendance() {
      try {
        loadingState.style.display = 'block';
        attendanceContent.style.display = 'none';
        emptyState.style.display = 'none';
        
        const academicYear = await getAcademicYear();
        const attendanceId = `${currentStudent.id}_${academicYear}`;
        
        const attendance = await getCachedData(
          CACHE_CONFIG.keys.student_attendance,
          () => fetchDocument('attendance', attendanceId),
          'student_attendance'
        );
        
        if (!attendance) {
          showEmptyState();
          return;
        }
        
        displayStatistics(attendance);
        displayProgressBar(attendance);
        await loadRecords(attendance);
        
        loadingState.style.display = 'none';
        attendanceContent.style.display = 'block';
        
      } catch (error) {
        console.error('❌ فشل تحميل بيانات الحضور:', error);
        showEmptyState('فشل تحميل بيانات الحضور. تأكد من اتصالك بالإنترنت.');
      }
    }
    
    // ===========================
    // عرض الإحصائيات
    // ===========================
    function displayStatistics(attendance) {
      const present = attendance.present || 0;
      const absent = attendance.absent || 0;
      const late = attendance.late || 0;
      const total = attendance.total_days || (present + absent + late);
      const presentPercent = total > 0 ? ((present / total) * 100).toFixed(1) : 0;
      
      let percentClass = 'good';
      if (presentPercent < 75) percentClass = 'danger';
      else if (presentPercent < 85) percentClass = 'warning';
      
      statsRow.innerHTML = `
        <div class="stat-card">
          <div class="stat-card-icon present"><i class="fas fa-user-check"></i></div>
          <div class="stat-value">${present}</div>
          <div class="stat-label">أيام الحضور</div>
          <div class="stat-percent ${percentClass}">${presentPercent}%</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon absent"><i class="fas fa-user-xmark"></i></div>
          <div class="stat-value">${absent}</div>
          <div class="stat-label">أيام الغياب</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon late"><i class="fas fa-user-clock"></i></div>
          <div class="stat-value">${late}</div>
          <div class="stat-label">مرات التأخير</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon total"><i class="fas fa-calendar-days"></i></div>
          <div class="stat-value">${total}</div>
          <div class="stat-label">إجمالي الأيام</div>
        </div>
      `;
    }
    
    // ===========================
    // عرض شريط التقدم
    // ===========================
    function displayProgressBar(attendance) {
      const present = attendance.present || 0;
      const absent = attendance.absent || 0;
      const late = attendance.late || 0;
      const total = attendance.total_days || (present + absent + late);
      
      if (total === 0) return;
      
      const presentWidth = (present / total) * 100;
      const absentWidth = (absent / total) * 100;
      const lateWidth = (late / total) * 100;
      
      progressSection.innerHTML = `
        <div class="progress-title">
          <i class="fas fa-chart-bar"></i>
          نسبة الحضور والغياب
        </div>
        <div class="progress-bar-container">
          <div class="progress-segment present" style="width:${presentWidth}%"></div>
          <div class="progress-segment absent" style="width:${absentWidth}%"></div>
          <div class="progress-segment late" style="width:${lateWidth}%"></div>
        </div>
        <div class="progress-legend">
          <span class="legend-item">
            <span class="legend-dot present"></span> حضور ${presentWidth.toFixed(1)}%
          </span>
          <span class="legend-item">
            <span class="legend-dot absent"></span> غياب ${absentWidth.toFixed(1)}%
          </span>
          <span class="legend-item">
            <span class="legend-dot late"></span> تأخير ${lateWidth.toFixed(1)}%
          </span>
        </div>
      `;
    }
    
    // ===========================
    // تحميل سجل الحضور
    // ===========================
    async function loadRecords(attendance) {
      try {
        const academicYear = await getAcademicYear();
        const attendanceId = `${currentStudent.id}_${academicYear}`;
        
        const recordsResult = await fetchDocuments(`attendance/${attendanceId}/records`, {
          orderByField: 'date',
          orderDirection: 'desc',
          limitCount: 30
        });
        
        const records = recordsResult.documents || [];
        
        if (records.length === 0) {
          recordsList.innerHTML = `
            <div style="text-align:center;padding:var(--space-3xl);color:var(--mute);">
              <i class="fas fa-inbox" style="font-size:32px;margin-bottom:var(--space-md);display:block;"></i>
              لا توجد سجلات يومية بعد
            </div>
          `;
          return;
        }
        
        recordsList.innerHTML = records.map(record => {
          const status = record.status || 'present';
          const date = record.date?.toDate ? record.date.toDate() : new Date(record.date);
          const dayName = DAY_NAMES[date.getDay()] || '';
          
          const statusLabels = { present: 'حاضر', absent: 'غائب', late: 'متأخر' };
          const statusIcons = { present: 'fa-check-circle', absent: 'fa-times-circle', late: 'fa-clock' };
          
          // تعقيم البيانات القادمة من Firestore
          const safeNote = safeEscapeHtml(record.note || '');
          const safeDate = safeEscapeHtml(formatDateArabic(date));
          const safeDayName = safeEscapeHtml(dayName);
          
          return `
            <div class="record-item">
              <div class="record-date">
                <div class="record-day-icon ${status}">
                  <i class="fas ${statusIcons[status]}"></i>
                </div>
                <div>
                  <div class="record-date-text">${safeDate}</div>
                  <div class="record-day-name">${safeDayName}</div>
                </div>
              </div>
              <div class="record-status">
                ${safeNote ? `<span class="record-note">${safeNote}</span>` : ''}
                <span class="status-badge ${status}">${statusLabels[status]}</span>
              </div>
            </div>
          `;
        }).join('');
        
      } catch (error) {
        console.warn('⚠️ فشل تحميل سجل الحضور:', error.message);
        recordsList.innerHTML = `
          <div style="text-align:center;padding:var(--space-3xl);color:var(--mute);">
            تعذر تحميل السجلات
          </div>
        `;
      }
    }
    
    // ===========================
    // عرض حالة فارغة
    // ===========================
    function showEmptyState(message = null) {
      loadingState.style.display = 'none';
      attendanceContent.style.display = 'none';
      emptyState.style.display = 'block';
      if (message) emptyState.querySelector('p').textContent = message;
    }
    
    // ===========================
    // بدء التهيئة
    // ===========================
    initPage();
  </script>
</body>
</html>
