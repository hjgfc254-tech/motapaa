<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description" content="جدول الحصص - مدارس الجيل الجديد الخاصة">
  <meta name="theme-color" content="#0A2647">
  <title>جدول الحصص | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    body {
      background: var(--page-bg);
      min-height: 100vh;
    }
    
    .top-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border-light);
      padding: var(--space-md) var(--space-xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    
    .top-bar-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .back-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--royal);
      text-decoration: none;
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      transition: color var(--transition-fast);
    }
    
    .back-btn:hover { color: var(--navy); }
    
    .page-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .page-header i { color: var(--royal); font-size: var(--text-xl); }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .main-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    .schedule-info {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: var(--space-lg) var(--space-xl);
      margin-bottom: var(--space-xl);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-md);
      box-shadow: var(--shadow-sm);
      border-right: 4px solid var(--royal);
    }
    
    .schedule-info-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-sm);
      color: var(--body);
    }
    
    .schedule-info-item i { color: var(--royal); width: 18px; text-align: center; }
    .schedule-info-item strong { color: var(--ink); font-family: var(--font-heading); }
    
    .schedule-wrapper {
      background: var(--white);
      border-radius: var(--radius-2xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    
    .schedule-table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    
    .schedule-table thead th {
      background: var(--navy-deep);
      color: var(--white);
      padding: var(--space-md) var(--space-sm);
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      text-align: center;
      white-space: nowrap;
      position: sticky;
      top: 0;
    }
    
    .schedule-table thead th:first-child { background: var(--navy); width: 80px; border-radius: 0 var(--radius-md) 0 0; }
    .schedule-table thead th:last-child { border-radius: var(--radius-md) 0 0 0; }
    
    .schedule-table tbody td {
      padding: var(--space-md) var(--space-sm);
      text-align: center;
      border-bottom: 1px solid var(--border-light);
      font-size: var(--text-sm);
      transition: background var(--transition-fast);
    }
    
    .schedule-table tbody td:first-child {
      background: var(--soft);
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      color: var(--navy-deep);
      font-size: var(--text-sm);
    }
    
    .schedule-table tbody tr:hover td { background: var(--royal-light); }
    .schedule-table tbody tr:hover td:first-child { background: var(--royal); color: var(--white); }
    
    .subject-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm);
    }
    
    .subject-name { font-family: var(--font-heading); font-weight: var(--weight-bold); color: var(--ink); font-size: var(--text-sm); }
    .subject-teacher { font-size: var(--text-xs); color: var(--body-light); }
    .subject-period { font-size: 10px; color: var(--mute); font-family: var(--font-numbers); }
    .empty-cell { color: var(--mute-light); font-size: var(--text-xs); }
    .break-cell { background: var(--warning-bg) !important; }
    .break-cell .subject-name { color: var(--warning); }
    
    .schedule-footer {
      padding: var(--space-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-light);
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    
    .legend { display: flex; gap: var(--space-lg); flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-xs); color: var(--body-light); }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
    .legend-dot.regular { background: var(--white); border: 2px solid var(--border); }
    .legend-dot.break { background: var(--warning-bg); border: 2px solid var(--warning); }
    
    .last-update { font-size: var(--text-xs); color: var(--mute); display: flex; align-items: center; gap: var(--space-xs); }
    
    .loading-state { text-align: center; padding: var(--space-5xl); }
    .loading-state .spinner { margin: 0 auto var(--space-lg); width: 40px; height: 40px; border-width: 4px; }
    .loading-state p { color: var(--body-light); }
    
    .empty-state { text-align: center; padding: var(--space-5xl); }
    .empty-state i { font-size: 56px; color: var(--mute-light); margin-bottom: var(--space-lg); display: block; }
    .empty-state h3 { font-family: var(--font-heading); color: var(--ink); margin-bottom: var(--space-sm); }
    .empty-state p { color: var(--body-light); font-size: var(--text-sm); }
    
    @media (max-width: 600px) {
      .top-bar { padding: var(--space-sm) var(--space-md); }
      .main-content { padding: var(--space-md); }
      .schedule-info { flex-direction: column; align-items: flex-start; padding: var(--space-md); }
      .schedule-table thead th { font-size: 11px; padding: var(--space-sm) var(--space-xs); }
      .schedule-table tbody td { padding: var(--space-sm) var(--space-xs); font-size: 11px; }
      .subject-name { font-size: 11px; }
      .subject-teacher { font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="student-dashboard.html" class="back-btn">
        <i class="fas fa-arrow-right"></i> العودة للوحة المتابعة
      </a>
      <div class="page-header">
        <h1>جدول الحصص</h1>
        <i class="fas fa-calendar-week"></i>
      </div>
    </div>
  </header>
  
  <main class="main-content">
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>جاري تحميل جدول الحصص...</p>
    </div>
    
    <div id="emptyState" class="empty-state" style="display:none;">
      <i class="fas fa-calendar-xmark"></i>
      <h3>لا يوجد جدول حصص</h3>
      <p>لم يتم رفع جدول الحصص بعد. يرجى التواصل مع الإدارة.</p>
    </div>
    
    <div id="scheduleContent" style="display:none;">
      <div class="schedule-info" id="scheduleInfo"></div>
      
      <div class="schedule-wrapper">
        <div class="schedule-table-container">
          <table class="schedule-table">
            <thead>
              <tr>
                <th>الحصة</th>
                <th>السبت</th><th>الأحد</th><th>الإثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
          </table>
        </div>
        <div class="schedule-footer">
          <div class="legend">
            <span class="legend-item"><span class="legend-dot regular"></span> حصة دراسية</span>
            <span class="legend-item"><span class="legend-dot break"></span> استراحة</span>
          </div>
          <div class="last-update" id="lastUpdate">
            <i class="fas fa-clock"></i><span>—</span>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script type="module">
    import { authManager } from './js/auth-system.js';
    import { fetchDocument } from './js/firebase-config.js';
    import { getCachedData, CACHE_CONFIG } from './js/cache-manager.js';
    import { formatDateArabic, formatTimeArabic, escapeHtml } from './js/utils.js';
    
    // دالة تعقيم احتياطية
    const safeEscapeHtml = (str) => {
      if (typeof escapeHtml === 'function') return escapeHtml(str);
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };
    
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const scheduleContent = document.getElementById('scheduleContent');
    const scheduleInfo = document.getElementById('scheduleInfo');
    const scheduleTableBody = document.getElementById('scheduleTableBody');
    const lastUpdate = document.getElementById('lastUpdate');
    
    const DAYS = ['saturday', 'sunday', 'monday', 'tuesday', 'wednesday', 'thursday'];
    
    async function initPage() {
      try {
        const session = await authManager.initialize();
        if (!session.isAuthenticated || session.type !== 'student') {
          window.location.href = 'index.html';
          return;
        }
        const student = session.user;
        await loadSchedule(student);
      } catch (error) {
        console.error('❌ فشل تحميل الصفحة:', error);
        loadingState.style.display = 'none';
        emptyState.style.display = 'block';
        emptyState.querySelector('p').textContent = 'حدث خطأ في تحميل جدول الحصص. يرجى المحاولة لاحقاً.';
      }
    }
    
    async function loadSchedule(student) {
      try {
        const classId = student.class_id;
        if (!classId) {
          showEmptyState('لم يتم تعيين فصل دراسي لك. يرجى التواصل مع الإدارة.');
          return;
        }
        
        const schedule = await getCachedData(
          CACHE_CONFIG.keys.student_schedule,
          () => fetchDocument('schedules', `${classId}_schedule`),
          'student_schedule'
        );
        
        if (!schedule || !schedule.days) {
          showEmptyState();
          return;
        }
        
        displayScheduleInfo(student, schedule);
        buildScheduleTable(schedule);
        
        if (schedule.updatedAt) {
          const date = schedule.updatedAt.toDate ? schedule.updatedAt.toDate() : new Date(schedule.updatedAt);
          lastUpdate.querySelector('span').textContent = `آخر تحديث: ${formatDateArabic(date)}`;
        }
        
        loadingState.style.display = 'none';
        scheduleContent.style.display = 'block';
      } catch (error) {
        console.error('❌ فشل تحميل الجدول:', error);
        showEmptyState();
      }
    }
    
    function displayScheduleInfo(student, schedule) {
      // تعقيم بيانات الطالب
      const safeClassName = safeEscapeHtml(student.class_name || '—');
      const safeStageName = safeEscapeHtml(student.stage_name || '—');
      
      scheduleInfo.innerHTML = `
        <div class="schedule-info-item">
          <i class="fas fa-door-open"></i>
          <span>الفصل: <strong>${safeClassName}</strong></span>
        </div>
        <div class="schedule-info-item">
          <i class="fas fa-layer-group"></i>
          <span>المرحلة: <strong>${safeStageName}</strong></span>
        </div>
        <div class="schedule-info-item">
          <i class="fas fa-clock"></i>
          <span>عدد الحصص: <strong>${countTotalPeriods(schedule)}</strong></span>
        </div>
      `;
    }
    
    function countTotalPeriods(schedule) {
      let count = 0;
      DAYS.forEach(day => {
        if (schedule.days[day] && Array.isArray(schedule.days[day])) {
          count += schedule.days[day].length;
        }
      });
      return count;
    }
    
    function buildScheduleTable(schedule) {
      let maxPeriods = 0;
      DAYS.forEach(day => {
        if (schedule.days[day] && Array.isArray(schedule.days[day])) {
          maxPeriods = Math.max(maxPeriods, schedule.days[day].length);
        }
      });
      
      if (maxPeriods === 0) {
        showEmptyState();
        return;
      }
      
      let rowsHTML = '';
      
      for (let i = 0; i < maxPeriods; i++) {
        rowsHTML += '<tr>';
        rowsHTML += `<td>الحصة ${i + 1}</td>`;
        
        DAYS.forEach(day => {
          const periods = schedule.days[day] || [];
          const period = periods[i];
          
          if (period) {
            const isBreak = period.subject === 'استراحة' || 
                           period.subject === 'فاصل' || 
                           period.subject === 'فرصة';
            
            // تعقيم بيانات الجدول القادمة من Firestore
            const safeSubject = safeEscapeHtml(period.subject || '—');
            const safeTeacher = safeEscapeHtml(period.teacher || '');
            
            rowsHTML += `
              <td class="${isBreak ? 'break-cell' : ''}">
                <div class="subject-cell">
                  <span class="subject-name">${safeSubject}</span>
                  ${safeTeacher ? `<span class="subject-teacher">${safeTeacher}</span>` : ''}
                  <span class="subject-period">الحصة ${period.period || i + 1}</span>
                </div>
              </td>
            `;
          } else {
            rowsHTML += `<td><span class="empty-cell">—</span></td>`;
          }
        });
        
        rowsHTML += '</tr>';
      }
      
      scheduleTableBody.innerHTML = rowsHTML;
    }
    
    function showEmptyState(message = null) {
      loadingState.style.display = 'none';
      scheduleContent.style.display = 'none';
      emptyState.style.display = 'block';
      if (message) emptyState.querySelector('p').textContent = message;
    }
    
    initPage();
  </script>
</body>
</html>
