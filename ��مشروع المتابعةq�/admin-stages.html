<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>المراحل والفصول | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    :root {
      --sidebar-width: 260px;
      --topbar-height: 64px;
    }
    
    body {
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      font-family: var(--font-body);
    }
    
    .sidebar {
      width: var(--sidebar-width);
      background: var(--navy-deep);
      color: var(--white);
      height: 100vh;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-smooth);
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    .sidebar-header {
      padding: var(--space-xl);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    
    .sidebar-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: contain;
      background: white;
      padding: 3px;
      margin: 0 auto var(--space-md);
      display: block;
    }
    
    .sidebar-school-name {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--white);
      line-height: 1.3;
    }
    
    .sidebar-school-name small {
      display: block;
      font-weight: var(--weight-regular);
      font-size: var(--text-xs);
      opacity: 0.6;
    }
    
    .sidebar-nav {
      flex: 1;
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    
    .nav-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.35);
      padding: var(--space-md) var(--space-md) var(--space-sm);
      font-weight: var(--weight-bold);
      font-family: var(--font-numbers);
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-lg);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-weight: var(--weight-medium);
      font-size: var(--text-sm);
      transition: all var(--transition-fast);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: right;
      font-family: var(--font-body);
    }
    
    .nav-item i {
      width: 22px;
      text-align: center;
      font-size: var(--text-base);
      flex-shrink: 0;
    }
    
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
    }
    
    .nav-item.active {
      background: var(--royal);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(30, 95, 187, 0.4);
    }
    
    .nav-item.danger:hover {
      background: var(--red);
      color: var(--white);
    }
    
    .sidebar-footer {
      padding: var(--space-lg);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .admin-info {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }
    
    .admin-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--royal);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--weight-bold);
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      flex-shrink: 0;
    }
    
    .admin-details {
      flex: 1;
      min-width: 0;
    }
    
    .admin-details .name {
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .admin-details .role {
      font-size: 11px;
      opacity: 0.6;
    }
    
    .main-wrapper {
      flex: 1;
      margin-right: var(--sidebar-width);
      min-height: 100vh;
    }
    
    .topbar {
      background: var(--white);
      height: var(--topbar-height);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-2xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-xs);
    }
    
    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }
    
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--ink);
      cursor: pointer;
      padding: var(--space-sm);
    }
    
    .page-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .topbar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--soft);
      border: none;
      color: var(--body);
      cursor: pointer;
      font-size: var(--text-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      position: relative;
    }
    
    .topbar-btn:hover {
      background: var(--royal-light);
      color: var(--royal);
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      display: none;
    }
    
    .sidebar-overlay.open {
      display: block;
    }
    
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
      .main-wrapper {
        margin-right: 0;
      }
    }

    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2xl);
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-2xl);
      color: var(--navy-deep);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      border-radius: var(--radius-full);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      font-family: var(--font-body);
    }
    
    .btn-primary {
      background: var(--royal);
      color: var(--white);
      box-shadow: var(--shadow-btn-blue);
    }
    
    .btn-primary:hover {
      background: var(--royal-hover);
      transform: translateY(-2px);
    }
    
    .btn-danger {
      background: var(--red);
      color: var(--white);
    }
    
    .btn-danger:hover {
      background: var(--red-hover);
      transform: translateY(-2px);
    }
    
    .btn-outline {
      background: var(--white);
      border: 2px solid var(--border);
      color: var(--body);
    }
    
    .btn-outline:hover {
      border-color: var(--royal);
      color: var(--royal);
    }
    
    .btn-sm {
      padding: var(--space-xs) var(--space-md);
      font-size: var(--text-xs);
    }
    
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: var(--space-xl);
      overflow: hidden;
    }
    
    .card-header {
      padding: var(--space-lg) var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .card-header h3 {
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-md);
      color: var(--ink);
    }
    
    .card-body {
      padding: var(--space-xl);
    }
    
    .form-group {
      margin-bottom: var(--space-lg);
    }
    
    .form-group label {
      display: block;
      font-family: var(--font-heading);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      color: var(--ink);
      margin-bottom: var(--space-sm);
    }
    
    .form-input {
      width: 100%;
      padding: var(--space-md) var(--space-lg);
      background: var(--soft);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--ink);
      transition: all var(--transition-base);
    }
    
    .form-input:focus {
      border-color: var(--border-focus);
      background: var(--white);
      box-shadow: var(--shadow-input-focus);
      outline: none;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-lg);
    }
    
    .table-container {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    table th {
      background: var(--soft);
      padding: var(--space-md);
      text-align: right;
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-xs);
      color: var(--body-light);
      border-bottom: 2px solid var(--border);
    }
    
    table td {
      padding: var(--space-md);
      border-bottom: 1px solid var(--border-light);
      font-size: var(--text-sm);
      color: var(--ink);
    }
    
    table tr:hover td {
      background: var(--royal-light);
    }
    
    .badge {
      display: inline-block;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--weight-bold);
    }
    
    .badge-info {
      background: var(--royal-light);
      color: var(--royal);
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 38, 71, 0.5);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      animation: fadeIn 0.2s ease;
    }
    
    .modal {
      background: var(--white);
      border-radius: var(--radius-2xl);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-3xl);
      animation: slideUp 0.3s ease;
    }
    
    .modal-header {
      padding: var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-header h3 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--soft);
      border: none;
      color: var(--body);
      cursor: pointer;
      font-size: var(--text-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-close:hover {
      background: var(--red-light);
      color: var(--red);
    }
    
    .modal-body {
      padding: var(--space-xl);
    }
    
    .modal-footer {
      padding: var(--space-lg) var(--space-xl);
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: var(--space-md);
      justify-content: flex-end;
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-3xl);
      color: var(--mute);
    }
    
    .empty-state i {
      font-size: 40px;
      margin-bottom: var(--space-md);
      display: block;
    }
    
    .actions-cell {
      display: flex;
      gap: var(--space-sm);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 600px) {
      .page-container { padding: var(--space-md); }
      .form-row { grid-template-columns: 1fr; }
      .page-header h1 { font-size: var(--text-xl); }
    }
  </style>
</head>
<body>

      </a>

      </a>
      
      <div class="nav-section-title">المالية</div>

      </a>
    </nav>
    
    <div class="sidebar-footer">
      <div class="admin-info">
        <div class="admin-avatar" id="adminAvatar">م</div>
        <div class="admin-details">
          <div class="name" id="adminName">المشرف</div>
          <div class="role" id="adminRole">مدير عام</div>
        </div>
      </div>
      <button class="nav-item danger" onclick="window.location.href='admin-login.html'" style="width:100%;">
        <i class="fas fa-right-from-bracket"></i> تسجيل الخروج
      </button>
    </div>
  </aside>
  
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="page-title" id="pageTitle">المراحل والفصول</h1>
      </div>
      <div class="topbar-right">
        <a href="admin-dashboard.html" class="topbar-btn" title="الرئيسية">
          <i class="fas fa-home"></i>
        </a>
      </div>
    </header>
    
    <div style="padding:var(--space-2xl);flex:1;" id="contentArea">
        <div class="page-header">
          <h1>📚 المراحل والفصول</h1>
          <button class="btn btn-primary" id="btnAddStage">
            <i class="fas fa-plus"></i> إضافة مرحلة
          </button>
        </div>
        
        <div id="stagesContainer"></div>
    </div>
  </div>
  
  <script type="module">
    import { adminStages } from './js/admin-stages.js';
    import { showToast, showConfirm, escapeHtml } from './js/utils.js';
    
    // دوال تعقيم احتياطية
    const safeEscapeHtml = (str) => {
      if (typeof escapeHtml === 'function') return escapeHtml(str);
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };
    
    const escapeAttr = (str) => {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    
    const stagesContainer = document.getElementById('stagesContainer');
    const btnAddStage = document.getElementById('btnAddStage');
    
    async function loadStages() {
      try {
        const stages = await adminStages.getStages();
        
        if (stages.length === 0) {
          stagesContainer.innerHTML = `
            <div class="card">
              <div class="card-body">
                <div class="empty-state">
                  <i class="fas fa-layer-group"></i>
                  <p>لا توجد مراحل دراسية بعد. ابدأ بإضافة أول مرحلة.</p>
                </div>
              </div>
            </div>
          `;
          return;
        }
        
        stagesContainer.innerHTML = stages.map(stage => {
          // تعقيم بيانات المرحلة
          const safeStageName = safeEscapeHtml(stage.name || '');
          const safeAttrStageName = escapeAttr(stage.name || '');
          const safeAttrStageId = escapeAttr(stage.id || '');
          
          return `
          <div class="card">
            <div class="card-header">
              <h3>${safeStageName}</h3>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-outline btn-sm btnAddClass" data-stage-id="${safeAttrStageId}" data-stage-name="${safeAttrStageName}">
                  <i class="fas fa-plus"></i> إضافة فصل
                </button>
                <button class="btn btn-outline btn-sm btnEditStage" data-stage-id="${safeAttrStageId}" data-stage-name="${safeAttrStageName}">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-danger btn-sm btnDeleteStage" data-stage-id="${safeAttrStageId}" data-stage-name="${safeAttrStageName}">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
            <div class="card-body">
              <div class="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>اسم الفصل</th>
                      <th>عدد الطلاب</th>
                      <th>إجراءات</th>
                    </tr>
                  </thead>
                  <tbody class="classes-tbody" data-stage-id="${safeAttrStageId}">
                    <tr><td colspan="3" style="text-align:center;color:var(--mute);">جاري تحميل الفصول...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `}).join('');
        
        for (const stage of stages) {
          loadClasses(stage.id);
        }
        
        attachStageEvents();
        
      } catch (error) {
        showToast('فشل تحميل المراحل', 'error');
      }
    }
    
    async function loadClasses(stageId) {
      try {
        const tbody = document.querySelector(`.classes-tbody[data-stage-id="${escapeAttr(stageId)}"]`);
        if (!tbody) return;
        
        const classes = await adminStages.getClasses(stageId);
        
        if (classes.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:var(--mute);">لا توجد فصول</td></tr>`;
          return;
        }
        
        tbody.innerHTML = classes.map(cls => {
          const safeClassName = safeEscapeHtml(cls.name || '');
          const safeAttrClassName = escapeAttr(cls.name || '');
          const safeAttrClassId = escapeAttr(cls.id || '');
          const safeAttrStageId = escapeAttr(stageId || '');
          
          return `
          <tr>
            <td>${safeClassName}</td>
            <td><span class="badge badge-info">0 طالب</span></td>
            <td>
              <div class="actions-cell">
                <button class="btn btn-outline btn-sm btnEditClass" data-class-id="${safeAttrClassId}" data-class-name="${safeAttrClassName}" data-stage-id="${safeAttrStageId}">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-danger btn-sm btnDeleteClass" data-class-id="${safeAttrClassId}" data-class-name="${safeAttrClassName}" data-stage-id="${safeAttrStageId}">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `}).join('');
        
        attachClassEvents();
        
      } catch (error) {
        const tbody = document.querySelector(`.classes-tbody[data-stage-id="${escapeAttr(stageId)}"]`);
        if (tbody) tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:var(--red);">فشل التحميل</td></tr>`;
      }
    }
    
    function attachStageEvents() {
      document.querySelectorAll('.btnAddClass').forEach(btn => {
        btn.addEventListener('click', () => showClassModal(btn.dataset.stageId, btn.dataset.stageName));
      });
      
      document.querySelectorAll('.btnEditStage').forEach(btn => {
        btn.addEventListener('click', () => showStageModal(btn.dataset.stageId, btn.dataset.stageName));
      });
      
      document.querySelectorAll('.btnDeleteStage').forEach(btn => {
        btn.addEventListener('click', async () => {
          const safeName = btn.dataset.stageName || 'هذه المرحلة';
          const confirmed = await showConfirm(`حذف مرحلة "${safeName}"؟`, 'تأكيد');
          if (confirmed) {
            await adminStages.deleteStage(btn.dataset.stageId);
            loadStages();
          }
        });
      });
    }
    
    function attachClassEvents() {
      document.querySelectorAll('.btnEditClass').forEach(btn => {
        btn.addEventListener('click', () => showClassModal(btn.dataset.stageId, '', btn.dataset.classId, btn.dataset.className));
      });
      
      document.querySelectorAll('.btnDeleteClass').forEach(btn => {
        btn.addEventListener('click', async () => {
          const safeName = btn.dataset.className || 'هذا الفصل';
          const confirmed = await showConfirm(`حذف فصل "${safeName}"؟`, 'تأكيد');
          if (confirmed) {
            await adminStages.deleteClass(btn.dataset.classId);
            loadClasses(btn.dataset.stageId);
          }
        });
      });
    }
    
    function showStageModal(stageId = null, stageName = '') {
      const isEdit = !!stageId;
      const safeStageName = escapeAttr(stageName || '');
      const safeStageNameDisplay = safeEscapeHtml(stageName || '');
      
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>${isEdit ? 'تعديل مرحلة' : 'إضافة مرحلة جديدة'}</h3>
            <button class="modal-close"><i class="fas fa-times"></i></button>
          </div>
          <form id="stageForm">
            <div class="modal-body">
              <div class="form-group">
                <label>اسم المرحلة</label>
                <input type="text" class="form-input" id="stageName" value="${safeStageName}" required placeholder="مثال: الصف الأول الابتدائي">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline close-modal">إلغاء</button>
              <button type="submit" class="btn btn-primary">${isEdit ? 'تحديث' : 'إضافة'}</button>
            </div>
          </form>
        </div>
      `;
      
      document.body.appendChild(overlay);
      
      const closeModal = () => overlay.remove();
      overlay.querySelector('.modal-close').addEventListener('click', closeModal);
      overlay.querySelector('.close-modal').addEventListener('click', closeModal);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
      
      overlay.querySelector('#stageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = overlay.querySelector('#stageName').value.trim();
        if (!name) return showToast('يرجى إدخال اسم المرحلة', 'warning');
        
        try {
          if (isEdit) {
            await adminStages.updateStage(stageId, { name });
          } else {
            await adminStages.addStage({ name });
          }
          closeModal();
          loadStages();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    }
    
    function showClassModal(stageId, stageName, classId = null, className = '') {
      const isEdit = !!classId;
      const safeClassName = escapeAttr(className || '');
      const safeStageNameDisplay = safeEscapeHtml(stageName || '');
      
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>${isEdit ? 'تعديل فصل' : 'إضافة فصل جديد'} ${safeStageNameDisplay ? '- ' + safeStageNameDisplay : ''}</h3>
            <button class="modal-close"><i class="fas fa-times"></i></button>
          </div>
          <form id="classForm">
            <div class="modal-body">
              <div class="form-group">
                <label>اسم الفصل</label>
                <input type="text" class="form-input" id="className" value="${safeClassName}" required placeholder="مثال: فصل 1/1">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline close-modal">إلغاء</button>
              <button type="submit" class="btn btn-primary">${isEdit ? 'تحديث' : 'إضافة'}</button>
            </div>
          </form>
        </div>
      `;
      
      document.body.appendChild(overlay);
      
      const closeModal = () => overlay.remove();
      overlay.querySelector('.modal-close').addEventListener('click', closeModal);
      overlay.querySelector('.close-modal').addEventListener('click', closeModal);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
      
      overlay.querySelector('#classForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = overlay.querySelector('#className').value.trim();
        if (!name) return showToast('يرجى إدخال اسم الفصل', 'warning');
        
        try {
          if (isEdit) {
            await adminStages.updateClass(classId, { name });
          } else {
            await adminStages.addClass(stageId, { name });
          }
          closeModal();
          loadClasses(stageId);
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    }
    
    btnAddStage.addEventListener('click', () => showStageModal());
    
    loadStages();
  </script>
</body>
</html>
