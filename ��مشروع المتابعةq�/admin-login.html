<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description" content="لوحة تحكم مدارس الجيل الجديد الخاصة - دخول الإدارة">
  <meta name="theme-color" content="#0A2647">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex, nofollow">
  <title>دخول الإدارة | مدارس الجيل الجديد الخاصة</title>
  
  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- نظام التصميم -->
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    /* ===========================
       تنسيقات صفحة دخول الإدارة
       =========================== */
    
    .admin-login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--space-xl);
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 30%, #f2f5f9 60%, #edf1f7 100%);
    }
    
    /* تأثيرات خلفية */
    .admin-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    
    .admin-bg-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.05;
    }
    
    .admin-bg-shape.shape1 {
      width: 500px;
      height: 500px;
      background: var(--navy-deep);
      top: -150px;
      right: -100px;
      animation: adminFloat1 15s ease-in-out infinite;
    }
    
    .admin-bg-shape.shape2 {
      width: 350px;
      height: 350px;
      background: var(--royal);
      bottom: -100px;
      left: -80px;
      animation: adminFloat2 12s ease-in-out infinite;
    }
    
    .admin-bg-shape.shape3 {
      width: 200px;
      height: 200px;
      background: var(--red);
      top: 50%;
      left: 15%;
      opacity: 0.03;
      animation: adminFloat3 10s ease-in-out infinite;
    }
    
    /* شبكة خلفية */
    .admin-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
      background-image: 
        linear-gradient(rgba(30, 95, 187, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 95, 187, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    
    @keyframes adminFloat1 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(-30px, 20px) rotate(3deg); }
      66% { transform: translate(15px, -10px) rotate(-2deg); }
    }
    
    @keyframes adminFloat2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-20px, -25px) scale(1.1); }
    }
    
    @keyframes adminFloat3 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -15px); }
    }
    
    /* البطاقة الرئيسية */
    .admin-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-3xl);
      box-shadow: 
        0 30px 50px -20px rgba(10, 38, 71, 0.2),
        0 0 0 1px rgba(10, 38, 71, 0.05);
      overflow: hidden;
      position: relative;
      z-index: 1;
      transition: all var(--transition-smooth);
    }
    
    .admin-card:hover {
      box-shadow: 
        0 35px 60px -22px rgba(10, 38, 71, 0.25),
        0 0 0 1px rgba(30, 95, 187, 0.12);
    }
    
    /* شريط التدرج العلوي - معكوس للإدارة */
    .admin-accent-bar {
      height: 5px;
      background: linear-gradient(90deg, var(--red) 0%, var(--royal) 40%, var(--navy-deep) 100%);
      border-radius: var(--radius-3xl) var(--radius-3xl) 0 0;
    }
    
    /* جسم البطاقة */
    .admin-card-body {
      padding: var(--space-3xl) var(--space-2xl) var(--space-2xl);
    }
    
    /* الهيدر */
    .admin-header {
      text-align: center;
      margin-bottom: var(--space-3xl);
    }
    
    .admin-shield-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--space-lg);
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--royal) 100%);
      color: var(--white);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 
        0 12px 24px rgba(10, 38, 71, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform var(--transition-bounce);
    }
    
    .admin-shield-icon:hover {
      transform: scale(1.05) translateY(-2px);
    }
    
    .admin-brand-text h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-xl);
      color: var(--navy-deep);
      line-height: var(--leading-tight);
      margin: 0;
    }
    
    .admin-brand-text span {
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      color: var(--body-light);
      letter-spacing: 0.3px;
      display: block;
      margin-top: 2px;
    }
    
    .admin-subtitle {
      font-size: var(--text-sm);
      color: var(--body);
      font-weight: var(--weight-medium);
      margin-top: var(--space-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
    }
    
    .admin-subtitle .dot {
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.5); }
    }
    
    /* نموذج تسجيل الدخول */
    .admin-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    
    .input-label {
      font-family: var(--font-heading);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }
    
    .input-label .required-star {
      color: var(--red);
    }
    
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    
    .admin-input {
      width: 100%;
      padding: 15px 16px;
      padding-right: 48px;
      background: var(--soft);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: var(--text-md);
      color: var(--ink);
      transition: all var(--transition-base);
      direction: rtl;
    }
    
    .admin-input::placeholder {
      color: var(--placeholder);
      font-size: var(--text-sm);
    }
    
    .admin-input:hover {
      border-color: var(--border-hover);
    }
    
    .admin-input:focus {
      border-color: var(--border-focus);
      background: var(--white);
      box-shadow: var(--shadow-input-focus);
      outline: none;
    }
    
    .admin-input.error {
      border-color: var(--border-error);
      box-shadow: var(--shadow-input-error);
      background: var(--error-bg);
    }
    
    .admin-input-icon {
      position: absolute;
      right: 16px;
      color: var(--mute);
      font-size: var(--text-lg);
      pointer-events: none;
      transition: color var(--transition-fast);
      z-index: 1;
    }
    
    .admin-input:focus ~ .admin-input-icon {
      color: var(--royal);
    }
    
    .admin-input.error ~ .admin-input-icon {
      color: var(--red);
    }
    
    /* زر إظهار كلمة المرور */
    .admin-toggle-password {
      position: absolute;
      left: 12px;
      background: none;
      border: none;
      color: var(--mute);
      cursor: pointer;
      padding: 8px;
      font-size: var(--text-md);
      transition: color var(--transition-fast);
      z-index: 1;
    }
    
    .admin-toggle-password:hover {
      color: var(--body);
    }
    
    /* رسالة الخطأ */
    .field-error {
      font-size: var(--text-xs);
      color: var(--error);
      font-weight: var(--weight-medium);
      display: none;
      align-items: center;
      gap: var(--space-xs);
      animation: fadeIn var(--transition-fast);
    }
    
    .field-error.visible {
      display: flex;
    }
    
    /* زر تسجيل الدخول */
    .admin-login-btn {
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 100%);
      color: var(--white);
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-numbers);
      font-weight: var(--weight-bold);
      font-size: var(--text-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      box-shadow: 0 10px 20px -6px rgba(10, 38, 71, 0.35);
      transition: all var(--transition-smooth);
      position: relative;
      overflow: hidden;
      margin-top: var(--space-md);
    }
    
    .admin-login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.6s ease;
    }
    
    .admin-login-btn:hover {
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--royal) 100%);
      box-shadow: 0 14px 26px -8px rgba(10, 38, 71, 0.45);
      transform: translateY(-2px);
    }
    
    .admin-login-btn:hover::before {
      left: 100%;
    }
    
    .admin-login-btn:active {
      transform: scale(0.97);
    }
    
    .admin-login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .admin-login-btn:disabled::before {
      display: none;
    }
    
    .admin-login-btn .btn-icon {
      font-size: var(--text-lg);
      transition: transform var(--transition-base);
    }
    
    .admin-login-btn:hover .btn-icon {
      transform: translateX(3px);
    }
    
    /* رسالة خطأ عامة */
    .admin-general-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-right: 4px solid var(--error);
      border-radius: var(--radius-lg);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-md);
      font-size: var(--text-sm);
      color: var(--error);
      font-weight: var(--weight-medium);
      display: none;
      animation: slideUp 0.3s ease;
    }
    
    .admin-general-error.visible {
      display: flex;
    }
    
    .admin-general-error i {
      font-size: var(--text-xl);
      flex-shrink: 0;
    }
    
    /* تذييل */
    .admin-footer {
      text-align: center;
      margin-top: var(--space-2xl);
      padding-top: var(--space-lg);
      border-top: 1px solid var(--border-light);
    }
    
    .admin-footer-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-lg);
      flex-wrap: wrap;
    }
    
    .back-to-student {
      font-size: var(--text-sm);
      color: var(--royal);
      font-weight: var(--weight-semibold);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      transition: color var(--transition-fast);
    }
    
    .back-to-student:hover {
      color: var(--navy);
    }
    
    .admin-version {
      font-size: var(--text-xs);
      color: var(--mute);
    }
    
    /* مؤشر التحميل */
    .btn-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* تحسينات الجوال */
    @media (max-width: 480px) {
      .admin-login-container {
        padding: var(--space-md);
        align-items: flex-start;
        padding-top: var(--space-4xl);
      }
      
      .admin-card-body {
        padding: var(--space-2xl) var(--space-lg) var(--space-xl);
      }
      
      .admin-shield-icon {
        width: 54px;
        height: 54px;
        font-size: 24px;
        border-radius: 16px;
      }
      
      .admin-brand-text h1 {
        font-size: var(--text-lg);
      }
      
      .admin-input {
        padding: 13px 14px;
        padding-right: 44px;
        font-size: var(--text-base);
      }
      
      .admin-login-btn {
        padding: 14px 20px;
        font-size: var(--text-base);
      }
    }
  </style>
</head>
<body>
  <!-- الخلفية -->
  <div class="admin-bg">
    <div class="admin-bg-shape shape1"></div>
    <div class="admin-bg-shape shape2"></div>
    <div class="admin-bg-shape shape3"></div>
  </div>
  <div class="admin-grid"></div>
  
  <!-- حاوية تسجيل الدخول -->
  <div class="admin-login-container">
    <div class="admin-card">
      <!-- شريط التدرج -->
      <div class="admin-accent-bar"></div>
      
      <!-- جسم البطاقة -->
      <div class="admin-card-body">
        <!-- الهيدر -->
        <div class="admin-header">
          <div class="admin-shield-icon">
            <i class="fas fa-shield-halved"></i>
          </div>
          <div class="admin-brand-text">
            <h1>لوحة التحكم</h1>
            <span>مدارس الجيل الجديد الخاصة</span>
          </div>
          <p class="admin-subtitle">
            <span class="dot"></span>
            دخول الإدارة فقط
            <span class="dot"></span>
          </p>
        </div>
        
        <!-- رسالة خطأ عامة -->
        <div class="admin-general-error" id="adminGeneralError">
          <i class="fas fa-shield-exclamation"></i>
          <span id="adminGeneralErrorText">حدث خطأ. يرجى المحاولة مرة أخرى.</span>
        </div>
        
        <!-- نموذج تسجيل الدخول -->
        <form class="admin-form" id="adminLoginForm" autocomplete="off" novalidate>
          <!-- حقل اسم المستخدم -->
          <div class="input-group">
            <label class="input-label" for="adminUsername">
              <i class="fas fa-user"></i> اسم المستخدم <span class="required-star">*</span>
            </label>
            <div class="input-wrapper">
              <i class="fas fa-user-shield admin-input-icon"></i>
              <input 
                type="text" 
                id="adminUsername" 
                class="admin-input" 
                placeholder="أدخل اسم المستخدم"
                autocomplete="off"
                dir="ltr"
                maxlength="30"
                required
              >
            </div>
            <div class="field-error" id="usernameError">
              <i class="fas fa-circle-exclamation"></i>
              <span>يرجى إدخال اسم المستخدم</span>
            </div>
          </div>
          
          <!-- حقل كلمة المرور -->
          <div class="input-group">
            <label class="input-label" for="adminPassword">
              <i class="fas fa-lock"></i> كلمة المرور <span class="required-star">*</span>
            </label>
            <div class="input-wrapper">
              <i class="fas fa-key admin-input-icon"></i>
              <input 
                type="password" 
                id="adminPassword" 
                class="admin-input" 
                placeholder="أدخل كلمة المرور"
                autocomplete="off"
                maxlength="30"
                required
              >
              <button type="button" class="admin-toggle-password" id="adminTogglePassword" tabindex="-1" aria-label="إظهار كلمة المرور">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="field-error" id="passwordError">
              <i class="fas fa-circle-exclamation"></i>
              <span>يرجى إدخال كلمة المرور</span>
            </div>
          </div>
          
          <!-- زر تسجيل الدخول -->
          <button type="submit" class="admin-login-btn" id="adminLoginButton">
            <i class="fas fa-lock-open btn-icon"></i>
            <span>دخول لوحة التحكم</span>
          </button>
        </form>
        
        <!-- التذييل -->
        <div class="admin-footer">
          <div class="admin-footer-content">
            <a href="index.html" class="back-to-student">
              <i class="fas fa-arrow-right"></i>
              صفحة الطالب
            </a>
            <span class="admin-version">
              <i class="fas fa-code-branch"></i> v2.0
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- السكربتات -->
  <script type="module">
    import { loginAdmin } from './js/auth-system.js';
    // [FIX] استخدام startSetupWizard بدلاً من initializeSystem
    import { startSetupWizard } from './js/auto-seeder.js';

    // ===========================
    // عناصر DOM
    // ===========================
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminUsernameInput = document.getElementById('adminUsername');
    const adminPasswordInput = document.getElementById('adminPassword');
    const adminTogglePasswordBtn = document.getElementById('adminTogglePassword');
    const adminLoginButton = document.getElementById('adminLoginButton');
    const adminGeneralError = document.getElementById('adminGeneralError');
    const adminGeneralErrorText = document.getElementById('adminGeneralErrorText');
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    
    let isSubmitting = false;
    
    // ===========================
    // إظهار/إخفاء كلمة المرور
    // ===========================
    adminTogglePasswordBtn.addEventListener('click', () => {
      const isPassword = adminPasswordInput.type === 'password';
      adminPasswordInput.type = isPassword ? 'text' : 'password';
      const icon = adminTogglePasswordBtn.querySelector('i');
      icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
      adminPasswordInput.focus();
    });
    
    // ===========================
    // دوال مساعدة
    // ===========================
    function showFieldError(input, errorElement, message) {
      input.classList.add('error');
      errorElement.querySelector('span').textContent = message;
      errorElement.classList.add('visible');
    }
    
    function clearFieldError(input, errorElement) {
      input.classList.remove('error');
      errorElement.classList.remove('visible');
    }
    
    function hideGeneralError() {
      adminGeneralError.classList.remove('visible');
    }
    
    function showGeneralError(message) {
      adminGeneralErrorText.textContent = message;
      adminGeneralError.classList.add('visible');
    }
    
    // ===========================
    // التحقق من صحة المدخلات
    // ===========================
    function validateForm() {
      let isValid = true;
      
      const username = adminUsernameInput.value.trim();
      if (!username) {
        showFieldError(adminUsernameInput, usernameError, 'يرجى إدخال اسم المستخدم');
        isValid = false;
      } else if (username.length < 3) {
        showFieldError(adminUsernameInput, usernameError, 'اسم المستخدم يجب أن يكون 3 أحرف على الأقل');
        isValid = false;
      } else {
        clearFieldError(adminUsernameInput, usernameError);
      }
      
      const password = adminPasswordInput.value;
      if (!password) {
        showFieldError(adminPasswordInput, passwordError, 'يرجى إدخال كلمة المرور');
        isValid = false;
      } else if (password.length < 6) {
        showFieldError(adminPasswordInput, passwordError, 'كلمة المرور يجب أن تكون 6 أحرف على الأقل');
        isValid = false;
      } else {
        clearFieldError(adminPasswordInput, passwordError);
      }
      
      return isValid;
    }
    
    // ===========================
    // تعطيل/تمكين النموذج
    // ===========================
    function setFormDisabled(disabled) {
      adminUsernameInput.disabled = disabled;
      adminPasswordInput.disabled = disabled;
      adminTogglePasswordBtn.disabled = disabled;
      adminLoginButton.disabled = disabled;
      isSubmitting = disabled;
      
      if (disabled) {
        adminLoginButton.innerHTML = `
          <span class="btn-spinner"></span>
          <span>جاري التحقق...</span>
        `;
      } else {
        adminLoginButton.innerHTML = `
          <i class="fas fa-lock-open btn-icon"></i>
          <span>دخول لوحة التحكم</span>
        `;
      }
    }
    
    // ===========================
    // معالجة تسجيل الدخول
    // ===========================
    adminLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (isSubmitting) return;
      
      hideGeneralError();
      clearFieldError(adminUsernameInput, usernameError);
      clearFieldError(adminPasswordInput, passwordError);
      
      if (!validateForm()) return;
      
      if (!navigator.onLine) {
        showGeneralError('لا يوجد اتصال بالإنترنت. يرجى التحقق من اتصالك والمحاولة مرة أخرى.');
        return;
      }
      
      setFormDisabled(true);
      
      const username = adminUsernameInput.value.trim();
      const password = adminPasswordInput.value;
      
      try {
        // [FIX] محاولة تهيئة النظام تلقائيًا باستخدام startSetupWizard إذا كانت هذه أول مرة
        try {
          const initResult = await startSetupWizard(false);
          console.log('📊 حالة التهيئة:', initResult.results);
        } catch (initError) {
          console.warn('⚠️ ملاحظة التهيئة:', initError.message);
        }
        
        const result = await loginAdmin(username, password, false);
        
        if (result.success) {
          const adminName = result.admin?.display_name || 'مدير';
          // [FIX] استخدام alert كبديل مؤقت لحين التأكد من وجود showToast
          alert(`مرحباً ${adminName} 🎉`);
          
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 800);
          
        } else {
          const errorCode = result.error?.code;
          const errorMessage = result.error?.message || 'حدث خطأ أثناء تسجيل الدخول';
          
          switch (errorCode) {
            case 'INVALID_CREDENTIALS':
              showFieldError(adminUsernameInput, usernameError, 'اسم المستخدم أو كلمة المرور غير صحيحة');
              showFieldError(adminPasswordInput, passwordError, 'اسم المستخدم أو كلمة المرور غير صحيحة');
              adminPasswordInput.value = '';
              adminPasswordInput.focus();
              break;
              
            case 'ACCOUNT_INACTIVE':
              showGeneralError(errorMessage);
              break;
              
            default:
              showGeneralError(errorMessage);
          }
        }
      } catch (error) {
        console.error('❌ خطأ غير متوقع:', error);
        showGeneralError('حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى لاحقاً.');
      } finally {
        setFormDisabled(false);
      }
    });
    
    // ===========================
    // تحسينات
    // ===========================
    adminUsernameInput.addEventListener('input', () => {
      clearFieldError(adminUsernameInput, usernameError);
      hideGeneralError();
    });
    
    adminPasswordInput.addEventListener('input', () => {
      clearFieldError(adminPasswordInput, passwordError);
      hideGeneralError();
    });
    
    adminUsernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        adminPasswordInput.focus();
      }
    });
    
    // التركيز التلقائي
    adminUsernameInput.focus();
    
    // مراقبة الاتصال
    window.addEventListener('online', () => {
      hideGeneralError();
    });
    
    window.addEventListener('offline', () => {
      showGeneralError('فقد الاتصال بالإنترنت. يرجى التحقق من اتصالك.');
    });
  </script>
</body>
</html>
