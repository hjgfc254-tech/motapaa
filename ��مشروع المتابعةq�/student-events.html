<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description" content="الأحداث والأنشطة - مدارس الجيل الجديد الخاصة">
  <meta name="theme-color" content="#0A2647">
  <title>الأحداث | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    body {
      background: var(--page-bg);
      min-height: 100vh;
    }
    
    .top-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border-light);
      padding: var(--space-md) var(--space-xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    
    .top-bar-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .back-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--royal);
      text-decoration: none;
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
    }
    
    .back-btn:hover { color: var(--navy); }
    
    .page-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .page-header i {
      color: var(--warning);
      font-size: var(--text-xl);
    }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .main-content {
      max-width: 800px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    /* أزرار التصفية */
    .filter-tabs {
      display: flex;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
      overflow-x: auto;
      padding-bottom: var(--space-sm);
      -webkit-overflow-scrolling: touch;
    }
    
    .filter-tab {
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--radius-full);
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      border: 2px solid var(--border);
      background: var(--white);
      color: var(--body);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }
    
    .filter-tab:hover {
      border-color: var(--royal);
      color: var(--royal);
    }
    
    .filter-tab.active {
      background: var(--royal);
      color: var(--white);
      border-color: var(--royal);
    }
    
    /* بطاقة حدث */
    .event-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: var(--space-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: all var(--transition-base);
      display: flex;
      flex-direction: column;
    }
    
    .event-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }
    
    .event-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mute-light);
      font-size: 48px;
    }
    
    .event-body {
      padding: var(--space-xl);
    }
    
    .event-type-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--weight-bold);
      margin-bottom: var(--space-md);
    }
    
    .badge-trip { background: var(--royal-light); color: var(--royal); }
    .badge-celebration { background: var(--red-light); color: var(--red); }
    .badge-competition { background: var(--warning-bg); color: var(--warning); }
    .badge-honor { background: var(--success-bg); color: var(--success); }
    .badge-activity { background: var(--info-bg); color: var(--info); }
    
    .event-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--ink);
      margin-bottom: var(--space-md);
      line-height: var(--leading-tight);
    }
    
    .event-description {
      font-size: var(--text-sm);
      color: var(--body);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-lg);
    }
    
    .event-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-lg);
    }
    
    .event-meta-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-xs);
      color: var(--body-light);
    }
    
    .event-meta-item i {
      color: var(--royal);
      width: 16px;
      text-align: center;
    }
    
    .event-date-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-lg);
      background: var(--soft);
      border-radius: var(--radius-full);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      color: var(--ink);
      margin-bottom: var(--space-lg);
    }
    
    .event-date-badge.upcoming {
      background: var(--royal-light);
      color: var(--royal);
    }
    
    .event-date-badge.past {
      background: var(--soft);
      color: var(--mute);
    }
    
    .event-date-badge i {
      font-size: var(--text-base);
    }
    
    /* حالات التحميل */
    .loading-state {
      text-align: center;
      padding: var(--space-5xl);
    }
    
    .loading-state .spinner {
      margin: 0 auto var(--space-lg);
      width: 40px;
      height: 40px;
      border-width: 4px;
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-5xl);
    }
    
    .empty-state i {
      font-size: 56px;
      color: var(--mute-light);
      margin-bottom: var(--space-lg);
      display: block;
    }
    
    .empty-state h3 {
      font-family: var(--font-heading);
      color: var(--ink);
      margin-bottom: var(--space-sm);
    }
    
    .empty-state p {
      color: var(--body-light);
      font-size: var(--text-sm);
    }
    
    @media (max-width: 600px) {
      .top-bar {
        padding: var(--space-sm) var(--space-md);
      }
      
      .main-content {
        padding: var(--space-md);
      }
      
      .event-image {
        height: 160px;
      }
      
      .event-body {
        padding: var(--space-lg);
      }
      
      .event-meta {
        gap: var(--space-md);
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="student-dashboard.html" class="back-btn">
        <i class="fas fa-arrow-right"></i>
        العودة للوحة المتابعة
      </a>
      <div class="page-header">
        <h1>الأحداث والأنشطة</h1>
        <i class="fas fa-calendar-star"></i>
      </div>
    </div>
  </header>
  
  <main class="main-content">
    <!-- أزرار التصفية -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">الكل</button>
      <button class="filter-tab" data-filter="upcoming">القادمة</button>
      <button class="filter-tab" data-filter="past">السابقة</button>
      <button class="filter-tab" data-filter="trip">رحلات</button>
      <button class="filter-tab" data-filter="celebration">احتفالات</button>
      <button class="filter-tab" data-filter="competition">مسابقات</button>
      <button class="filter-tab" data-filter="honor">تكريم</button>
      <button class="filter-tab" data-filter="activity">أنشطة</button>
    </div>
    
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>جاري تحميل الأحداث...</p>
    </div>
    
    <div id="emptyState" class="empty-state" style="display:none;">
      <i class="fas fa-calendar-xmark"></i>
      <h3>لا توجد أحداث</h3>
      <p>لا توجد أحداث متاحة حالياً.</p>
    </div>
    
    <div id="eventsList" style="display:none;"></div>
  </main>
  
  <script type="module">
    import { authManager } from './js/auth-system.js';
    import { fetchDocuments } from './js/firebase-config.js';
    import { getCachedData, setCachedData, CACHE_CONFIG } from './js/cache-manager.js';
    import { formatDateArabic, timeAgoArabic, escapeHtml } from './js/utils.js';
    
    // دوال تعقيم احتياطية
    const safeEscapeHtml = (str) => {
      if (typeof escapeHtml === 'function') return escapeHtml(str);
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };
    
    const escapeAttr = (str) => {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const eventsList = document.getElementById('eventsList');
    const filterTabs = document.getElementById('filterTabs');
    
    let currentStudent = null;
    let allEvents = [];
    let currentFilter = 'all';
    
    const TYPE_LABELS = {
      trip: 'رحلة',
      celebration: 'احتفال',
      competition: 'مسابقة',
      honor: 'تكريم',
      activity: 'نشاط'
    };
    
    const TYPE_ICONS = {
      trip: 'fa-bus',
      celebration: 'fa-cake-candles',
      competition: 'fa-trophy',
      honor: 'fa-medal',
      activity: 'fa-puzzle-piece'
    };
    
    // ===========================
    // التهيئة
    // ===========================
    async function initPage() {
      try {
        const session = await authManager.initialize();
        
        if (!session.isAuthenticated || session.type !== 'student') {
          window.location.href = 'index.html';
          return;
        }
        
        currentStudent = session.user;
        setupFilters();
        await loadEvents();
        
      } catch (error) {
        console.error('❌ فشل تحميل الصفحة:', error);
        showEmptyState('حدث خطأ في تحميل الأحداث.');
      }
    }
    
    // ===========================
    // إعداد أزرار التصفية
    // ===========================
    function setupFilters() {
      filterTabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.filter-tab');
        if (!tab) return;
        
        filterTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        currentFilter = tab.dataset.filter;
        filterAndRenderEvents();
      });
    }
    
    // ===========================
    // تحميل الأحداث
    // ===========================
    async function loadEvents() {
      try {
        loadingState.style.display = 'block';
        eventsList.style.display = 'none';
        emptyState.style.display = 'none';
        
        const result = await fetchDocuments('events', {
          orderByField: 'event_date',
          orderDirection: 'desc',
          limitCount: 30
        });
        
        allEvents = result.documents || [];
        
        // فلترة الأحداث التي تخص الطالب
        allEvents = allEvents.filter(event => {
          const targetType = event.target;
          if (!targetType || targetType === 'all') return true;
          if (targetType === 'stage' && event.target_ids?.includes(currentStudent.stage_id)) return true;
          if (targetType === 'class' && event.target_ids?.includes(currentStudent.class_id)) return true;
          return false;
        });
        
        if (allEvents.length === 0) {
          showEmptyState();
          return;
        }
        
        filterAndRenderEvents();
        
        loadingState.style.display = 'none';
        eventsList.style.display = 'block';
        
      } catch (error) {
        console.error('❌ فشل تحميل الأحداث:', error);
        showEmptyState('فشل تحميل الأحداث.');
      }
    }
    
    // ===========================
    // فلترة وعرض الأحداث
    // ===========================
    function filterAndRenderEvents() {
      let filtered = allEvents;
      const now = new Date();
      
      switch (currentFilter) {
        case 'upcoming':
          filtered = allEvents.filter(e => {
            const d = e.event_date?.toDate ? e.event_date.toDate() : new Date(e.event_date);
            return d >= now;
          });
          break;
        case 'past':
          filtered = allEvents.filter(e => {
            const d = e.event_date?.toDate ? e.event_date.toDate() : new Date(e.event_date);
            return d < now;
          });
          break;
        case 'all':
          break;
        default:
          filtered = allEvents.filter(e => e.type === currentFilter);
      }
      
      if (filtered.length === 0) {
        eventsList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-calendar-xmark"></i>
            <h3>لا توجد أحداث</h3>
            <p>لا توجد أحداث تطابق هذا التصنيف.</p>
          </div>
        `;
        return;
      }
      
      renderEvents(filtered);
    }
    
    // ===========================
    // عرض الأحداث (مع تعقيم كامل)
    // ===========================
    function renderEvents(events) {
      eventsList.innerHTML = events.map(event => {
        const type = event.type || 'activity';
        const typeLabel = TYPE_LABELS[type] || 'نشاط';
        const typeIcon = TYPE_ICONS[type] || 'fa-puzzle-piece';
        const eventDate = event.event_date?.toDate ? event.event_date.toDate() : new Date(event.event_date);
        const isUpcoming = eventDate >= new Date();
        const imageUrl = event.images && event.images.length > 0 ? event.images[0] : null;
        
        // تعقيم جميع البيانات القادمة من Firestore
        const safeTitle = safeEscapeHtml(event.title || 'حدث');
        const safeAttrTitle = escapeAttr(event.title || 'حدث');
        const safeDescription = safeEscapeHtml(event.description || '');
        const safeImageUrl = escapeAttr(imageUrl || '');
        const safeDate = safeEscapeHtml(formatDateArabic(eventDate));
        const safeTimeAgo = safeEscapeHtml(timeAgoArabic(eventDate));
        
        return `
          <div class="event-card">
            ${safeImageUrl ? 
              `<img src="${safeImageUrl}" alt="${safeAttrTitle}" class="event-image" onerror="this.style.display='none'">` :
              `<div class="event-image"><i class="fas ${typeIcon}"></i></div>`
            }
            <div class="event-body">
              <span class="event-type-badge badge-${type}">
                <i class="fas ${typeIcon}"></i> ${typeLabel}
              </span>
              
              <div class="event-date-badge ${isUpcoming ? 'upcoming' : 'past'}">
                <i class="fas ${isUpcoming ? 'fa-calendar-check' : 'fa-calendar'}"></i>
                ${isUpcoming ? 'قادم: ' : 'أقيم: '} ${safeDate}
              </div>
              
              <h3 class="event-title">${safeTitle}</h3>
              
              ${safeDescription ? `<p class="event-description">${safeDescription}</p>` : ''}
              
              <div class="event-meta">
                <span class="event-meta-item">
                  <i class="fas fa-clock"></i> ${safeTimeAgo}
                </span>
                <span class="event-meta-item">
                  <i class="fas fa-users"></i> ${event.target === 'all' ? 'لجميع الطلاب' : 'فئة محددة'}
                </span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // ===========================
    // عرض حالة فارغة
    // ===========================
    function showEmptyState(message = null) {
      loadingState.style.display = 'none';
      eventsList.style.display = 'none';
      emptyState.style.display = 'block';
      if (message) emptyState.querySelector('p').textContent = message;
    }
    
    // ===========================
    // بدء التهيئة
    // ===========================
    initPage();
  </script>
</body>
</html>
