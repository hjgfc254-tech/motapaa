<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>الإعلانات | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    :root {
      --sidebar-width: 260px;
      --topbar-height: 64px;
    }
    
    body {
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      font-family: var(--font-body);
    }
    
    .sidebar {
      width: var(--sidebar-width);
      background: var(--navy-deep);
      color: var(--white);
      height: 100vh;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-smooth);
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    .sidebar-header {
      padding: var(--space-xl);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    
    .sidebar-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: contain;
      background: white;
      padding: 3px;
      margin: 0 auto var(--space-md);
      display: block;
    }
    
    .sidebar-school-name {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--white);
      line-height: 1.3;
    }
    
    .sidebar-school-name small {
      display: block;
      font-weight: var(--weight-regular);
      font-size: var(--text-xs);
      opacity: 0.6;
    }
    
    .sidebar-nav {
      flex: 1;
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    
    .nav-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.35);
      padding: var(--space-md) var(--space-md) var(--space-sm);
      font-weight: var(--weight-bold);
      font-family: var(--font-numbers);
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-lg);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-weight: var(--weight-medium);
      font-size: var(--text-sm);
      transition: all var(--transition-fast);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: right;
      font-family: var(--font-body);
    }
    
    .nav-item i {
      width: 22px;
      text-align: center;
      font-size: var(--text-base);
      flex-shrink: 0;
    }
    
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
    }
    
    .nav-item.active {
      background: var(--royal);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(30, 95, 187, 0.4);
    }
    
    .nav-item.danger:hover {
      background: var(--red);
      color: var(--white);
    }
    
    .sidebar-footer {
      padding: var(--space-lg);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .admin-info {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }
    
    .admin-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--royal);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--weight-bold);
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      flex-shrink: 0;
    }
    
    .admin-details {
      flex: 1;
      min-width: 0;
    }
    
    .admin-details .name {
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .admin-details .role {
      font-size: 11px;
      opacity: 0.6;
    }
    
    .main-wrapper {
      flex: 1;
      margin-right: var(--sidebar-width);
      min-height: 100vh;
    }
    
    .topbar {
      background: var(--white);
      height: var(--topbar-height);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-2xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-xs);
    }
    
    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }
    
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--ink);
      cursor: pointer;
      padding: var(--space-sm);
    }
    
    .page-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .topbar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--soft);
      border: none;
      color: var(--body);
      cursor: pointer;
      font-size: var(--text-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      position: relative;
    }
    
    .topbar-btn:hover {
      background: var(--royal-light);
      color: var(--royal);
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      display: none;
    }
    
    .sidebar-overlay.open {
      display: block;
    }
    
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
      .main-wrapper {
        margin-right: 0;
      }
    }

    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2xl);
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-2xl);
      color: var(--navy-deep);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      border-radius: var(--radius-full);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      font-family: var(--font-body);
    }
    
    .btn-primary {
      background: var(--accent-red);
      color: var(--white);
      box-shadow: var(--shadow-btn-red);
    }
    
    .btn-primary:hover {
      background: var(--accent-red-hover);
      transform: translateY(-2px);
    }
    
    .btn-outline {
      background: var(--white);
      border: 2px solid var(--border);
      color: var(--body);
    }
    
    .btn-outline:hover {
      border-color: var(--royal);
      color: var(--royal);
    }
    
    .btn-danger {
      background: var(--red);
      color: var(--white);
    }
    
    .btn-danger:hover {
      background: var(--red-hover);
    }
    
    .btn-sm {
      padding: var(--space-xs) var(--space-md);
      font-size: var(--text-xs);
    }
    
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: var(--space-lg);
      overflow: hidden;
    }
    
    .card-header {
      padding: var(--space-lg) var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-md);
    }
    
    .card-body {
      padding: var(--space-xl);
    }
    
    .card-footer {
      padding: var(--space-md) var(--space-xl);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    
    .badge {
      display: inline-block;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--weight-bold);
      white-space: nowrap;
    }
    
    .badge-all { background: var(--royal-light); color: var(--royal); }
    .badge-stage { background: var(--info-bg); color: var(--info); }
    .badge-class { background: var(--warning-bg); color: var(--warning); }
    .badge-student { background: var(--red-light); color: var(--red); }
    
    .announcement-body {
      font-size: var(--text-sm);
      color: var(--body);
      line-height: var(--leading-relaxed);
    }
    
    .announcement-target {
      font-size: var(--text-xs);
      color: var(--mute);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 38, 71, 0.5);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      animation: fadeIn 0.2s ease;
    }
    
    .modal {
      background: var(--white);
      border-radius: var(--radius-2xl);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-3xl);
      animation: slideUp 0.3s ease;
    }
    
    .modal-header {
      padding: var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-header h3 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--soft);
      border: none;
      color: var(--body);
      cursor: pointer;
      font-size: var(--text-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-close:hover {
      background: var(--red-light);
      color: var(--red);
    }
    
    .modal-body {
      padding: var(--space-xl);
    }
    
    .modal-footer {
      padding: var(--space-lg) var(--space-xl);
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: var(--space-md);
      justify-content: flex-end;
    }
    
    .form-group {
      margin-bottom: var(--space-lg);
    }
    
    .form-group label {
      display: block;
      font-family: var(--font-heading);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      color: var(--ink);
      margin-bottom: var(--space-sm);
    }
    
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: var(--space-md) var(--space-lg);
      background: var(--soft);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--ink);
      transition: all var(--transition-base);
    }
    
    .form-textarea {
      min-height: 120px;
      resize: vertical;
    }
    
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--border-focus);
      background: var(--white);
      box-shadow: var(--shadow-input-focus);
      outline: none;
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-3xl);
      color: var(--mute);
    }
    
    .empty-state i {
      font-size: 40px;
      margin-bottom: var(--space-md);
      display: block;
    }
    
    .filter-tabs {
      display: flex;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
      flex-wrap: wrap;
    }
    
    .filter-tab {
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--radius-full);
      font-weight: var(--weight-bold);
      font-size: var(--text-xs);
      border: 2px solid var(--border);
      background: var(--white);
      color: var(--body);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .filter-tab:hover {
      border-color: var(--royal);
      color: var(--royal);
    }
    
    .filter-tab.active {
      background: var(--royal);
      color: var(--white);
      border-color: var(--royal);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 600px) {
      .page-container { padding: var(--space-md); }
      .page-header h1 { font-size: var(--text-xl); }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="document.getElementById('sidebar').classList.remove('open');this.classList.remove('open');"></div>
  
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">

    <div class="sidebar-footer">
      <div class="admin-info">
        <div class="admin-avatar" id="adminAvatar">م</div>
        <div class="admin-details">
          <div class="name" id="adminName">المشرف</div>
          <div class="role" id="adminRole">مدير عام</div>
        </div>
      </div>
      <button class="nav-item danger" onclick="window.location.href='admin-login.html'" style="width:100%;">
        <i class="fas fa-right-from-bracket"></i> تسجيل الخروج

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="page-title" id="pageTitle">الإعلانات</h1>
      </div>
      <div class="topbar-right">
        <a href="admin-dashboard.html" class="topbar-btn" title="الرئيسية">
          <i class="fas fa-home"></i>
        </a>
      </div>
    </header>
    
    <div style="padding:var(--space-2xl);flex:1;" id="contentArea">
        <div class="page-header">
          <h1>📢 الإعلانات</h1>
          <button class="btn btn-primary" id="btnCreate">
            <i class="fas fa-bullhorn"></i> إعلان جديد
          </button>
        </div>
        
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-filter="all">الكل</button>
          <button class="filter-tab" data-filter="all">عام</button>
          <button class="filter-tab" data-filter="stage">مرحلة</button>
          <button class="filter-tab" data-filter="class">فصل</button>
          <button class="filter-tab" data-filter="student">طالب</button>
        </div>
        
        <div id="announcementsContainer"></div>
    </div>
  </div>
  
  <script type="module">
    import { adminAnnouncements, formatAnnouncementForDisplay } from './js/admin-announcements.js';
    import { adminStages } from './js/admin-stages.js';
    import { adminStudents } from './js/admin-students.js';
    import { showToast, showConfirm, timeAgoArabic, escapeHtml } from './js/utils.js';
    
    // دوال تعقيم احتياطية
    const safeEscapeHtml = (str) => {
      if (typeof escapeHtml === 'function') return escapeHtml(str);
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };
    
    const escapeAttr = (str) => {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    
    const announcementsContainer = document.getElementById('announcementsContainer');
    const btnCreate = document.getElementById('btnCreate');
    const filterTabs = document.getElementById('filterTabs');
    
    let allStages = [];
    let allClasses = [];
    
    async function init() {
      try {
        const stagesResult = await adminStages.getStages();
        allStages = stagesResult;
        for (const stage of allStages) {
          const classes = await adminStages.getClasses(stage.id);
          allClasses = [...allClasses, ...classes.map(c => ({ ...c, stageName: stage.name }))];
        }
      } catch (e) {}
      
      filterTabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.filter-tab');
        if (!tab) return;
        filterTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        adminAnnouncements.currentFilters.targetType = tab.dataset.filter;
        adminAnnouncements.resetFilters();
        loadAnnouncements();
      });
      
      loadAnnouncements();
    }
    
    async function loadAnnouncements() {
      try {
        const result = await adminAnnouncements.getAnnouncements();
        const announcements = result.announcements || [];
        
        if (announcements.length === 0) {
          announcementsContainer.innerHTML = `
            <div class="card">
              <div class="card-body">
                <div class="empty-state">
                  <i class="fas fa-bullhorn"></i>
                  <p>لا توجد إعلانات. ابدأ بنشر أول إعلان.</p>
                </div>
              </div>
            </div>
          `;
          return;
        }
        
        announcementsContainer.innerHTML = announcements.map(a => {
          const formatted = formatAnnouncementForDisplay(a);
          const targetLabels = {
            all: 'عام',
            stage: 'مرحلة',
            class: 'فصل',
            student: 'طالب'
          };
          
          // تعقيم جميع البيانات القادمة من قاعدة البيانات
          const safeTitle = safeEscapeHtml(a.title || 'إعلان');
          const safeBody = safeEscapeHtml(a.body || '');
          const safeTargetType = safeEscapeHtml(a.target_type || 'all');
          const safeTargetLabel = targetLabels[a.target_type] || 'عام';
          const safeTargetLabels = a.target_labels?.length 
            ? a.target_labels.map(l => safeEscapeHtml(l)).join('، ') 
            : '';
          const safeBadgeText = safeTargetLabels 
            ? `${safeTargetLabel}: ${safeTargetLabels}` 
            : safeTargetLabel;
          const safeTimeAgo = safeEscapeHtml(formatted.timeAgo || '');
          const safeCreatedAt = safeEscapeHtml(formatted.createdAtFormatted || '');
          const safeAttrId = escapeAttr(a.id || '');
          const safeAttrTitle = escapeAttr(a.title || 'إعلان');
          
          return `
            <div class="card">
              <div class="card-header">
                <div style="flex:1;">
                  <h3 style="font-family:var(--font-heading);font-weight:var(--weight-bold);font-size:var(--text-md);color:var(--ink);margin-bottom:4px;">
                    ${safeTitle}
                  </h3>
                  <span class="badge badge-${safeTargetType}">
                    ${safeBadgeText}
                  </span>
                </div>
                <div style="display:flex;gap:8px;">
                  <button class="btn btn-outline btn-sm btnEdit" data-id="${safeAttrId}">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button class="btn btn-danger btn-sm btnDelete" data-id="${safeAttrId}" data-title="${safeAttrTitle}">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
              <div class="card-body">
                <div class="announcement-body">${safeBody}</div>
              </div>
              <div class="card-footer">
                <span class="announcement-target">
                  <i class="fas fa-clock"></i> ${safeTimeAgo}
                </span>
                <span style="font-size:var(--text-xs);color:var(--mute);">${safeCreatedAt}</span>
              </div>
            </div>
          `;
        }).join('');
        
        attachEvents();
        
      } catch (error) {
        announcementsContainer.innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--red);text-align:center;">فشل تحميل الإعلانات</p></div></div>`;
      }
    }
    
    function attachEvents() {
      document.querySelectorAll('.btnEdit').forEach(btn => {
        btn.addEventListener('click', () => showAnnouncementModal(btn.dataset.id));
      });
      
      document.querySelectorAll('.btnDelete').forEach(btn => {
        btn.addEventListener('click', async () => {
          // استخدام data-title المعقّم بأمان
          const safeTitle = btn.dataset.title || 'هذا الإعلان';
          const confirmed = await showConfirm(`حذف إعلان "${safeTitle}"؟`, 'تأكيد');
          if (confirmed) {
            await adminAnnouncements.deleteAnnouncement(btn.dataset.id);
            loadAnnouncements();
          }
        });
      });
    }
    
    async function showAnnouncementModal(announcementId = null) {
      const isEdit = !!announcementId;
      let announcement = null;
      
      if (isEdit) {
        announcement = await adminAnnouncements.getAnnouncement(announcementId);
        if (!announcement) return showToast('الإعلان غير موجود', 'error');
      }
      
      // تعقيم قيم announcement لإدراجها في HTML attributes
      const safeTitle = escapeAttr(announcement?.title || '');
      const safeBody = escapeAttr(announcement?.body || '');
      const safeTargetStudent = escapeAttr(announcement?.target_ids?.[0] || '');
      
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>${isEdit ? 'تعديل إعلان' : 'إعلان جديد'}</h3>
            <button class="modal-close"><i class="fas fa-times"></i></button>
          </div>
          <form id="announcementForm">
            <div class="modal-body">
              <div class="form-group">
                <label>العنوان *</label>
                <input type="text" class="form-input" id="aTitle" value="${safeTitle}" required maxlength="150" placeholder="عنوان الإعلان">
              </div>
              <div class="form-group">
                <label>المحتوى *</label>
                <textarea class="form-textarea" id="aBody" required maxlength="2000" placeholder="نص الإعلان...">${safeBody}</textarea>
              </div>
              <div class="form-group">
                <label>الفئة المستهدفة *</label>
                <select class="form-select" id="aTargetType">
                  <option value="all" ${announcement?.target_type === 'all' ? 'selected' : ''}>عام - كل المدرسة</option>
                  <option value="stage" ${announcement?.target_type === 'stage' ? 'selected' : ''}>مرحلة محددة</option>
                  <option value="class" ${announcement?.target_type === 'class' ? 'selected' : ''}>فصل محدد</option>
                  <option value="student" ${announcement?.target_type === 'student' ? 'selected' : ''}>طالب محدد</option>
                </select>
              </div>
              <div class="form-group" id="targetStageGroup" style="display:none;">
                <label>اختر المرحلة</label>
                <select class="form-select" id="aTargetStage">
                  <option value="">اختر المرحلة</option>
                  ${allStages.map(s => `<option value="${escapeAttr(s.id)}" ${announcement?.target_ids?.includes(s.id) ? 'selected' : ''}>${safeEscapeHtml(s.name)}</option>`).join('')}
                </select>
              </div>
              <div class="form-group" id="targetClassGroup" style="display:none;">
                <label>اختر الفصل</label>
                <select class="form-select" id="aTargetClass">
                  <option value="">اختر الفصل</option>
                </select>
              </div>
              <div class="form-group" id="targetStudentGroup" style="display:none;">
                <label>كود الطالب</label>
                <input type="text" class="form-input" id="aTargetStudent" placeholder="أدخل كود الطالب" value="${safeTargetStudent}">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline close-modal">إلغاء</button>
              <button type="submit" class="btn btn-primary">${isEdit ? 'تحديث' : 'نشر'}</button>
            </div>
          </form>
        </div>
      `;
      
      document.body.appendChild(overlay);
      
      const closeModal = () => overlay.remove();
      overlay.querySelector('.modal-close').addEventListener('click', closeModal);
      overlay.querySelector('.close-modal').addEventListener('click', closeModal);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
      
      const targetTypeSelect = overlay.querySelector('#aTargetType');
      const targetStageGroup = overlay.querySelector('#targetStageGroup');
      const targetClassGroup = overlay.querySelector('#targetClassGroup');
      const targetStudentGroup = overlay.querySelector('#targetStudentGroup');
      const targetStageSelect = overlay.querySelector('#aTargetStage');
      const targetClassSelect = overlay.querySelector('#aTargetClass');
      
      function toggleTargetFields() {
        const type = targetTypeSelect.value;
        targetStageGroup.style.display = type === 'stage' || type === 'class' ? 'block' : 'none';
        targetClassGroup.style.display = type === 'class' ? 'block' : 'none';
        targetStudentGroup.style.display = type === 'student' ? 'block' : 'none';
      }
      
      targetTypeSelect.addEventListener('change', toggleTargetFields);
      
      targetStageSelect.addEventListener('change', async () => {
        if (!targetStageSelect.value) {
          targetClassSelect.innerHTML = '<option value="">اختر الفصل</option>';
          return;
        }
        try {
          const classes = await adminStages.getClasses(targetStageSelect.value);
          targetClassSelect.innerHTML = '<option value="">اختر الفصل</option>' + 
            classes.map(c => `<option value="${escapeAttr(c.id)}" ${announcement?.target_ids?.includes(c.id) ? 'selected' : ''}>${safeEscapeHtml(c.name)}</option>`).join('');
        } catch (e) {
          targetClassSelect.innerHTML = '<option value="">اختر الفصل</option>';
        }
      });
      
      toggleTargetFields();
      if (announcement?.target_type === 'stage') {
        targetStageSelect.dispatchEvent(new Event('change'));
      }
      
      overlay.querySelector('#announcementForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const title = overlay.querySelector('#aTitle').value.trim();
        const body = overlay.querySelector('#aBody').value.trim();
        const targetType = targetTypeSelect.value;
        
        if (!title) return showToast('العنوان مطلوب', 'warning');
        if (!body) return showToast('المحتوى مطلوب', 'warning');
        
        const data = { title, body, target_type: targetType, target_ids: [], target_labels: [] };
        
        if (targetType === 'stage') {
          const stageId = targetStageSelect.value;
          if (!stageId) return showToast('اختر المرحلة', 'warning');
          data.target_ids = [stageId];
          data.target_labels = [targetStageSelect.selectedOptions[0]?.text || ''];
        } else if (targetType === 'class') {
          const classId = targetClassSelect.value;
          if (!classId) return showToast('اختر الفصل', 'warning');
          data.target_ids = [classId];
          data.target_labels = [targetClassSelect.selectedOptions[0]?.text || ''];
        } else if (targetType === 'student') {
          const code = overlay.querySelector('#aTargetStudent').value.trim();
          if (!code) return showToast('أدخل كود الطالب', 'warning');
          try {
            const result = await adminStudents.getStudents({ filters: { search: code } });
            const student = result.students?.find(s => s.code === code);
            if (!student) return showToast('الطالب غير موجود', 'error');
            data.target_ids = [student.id];
            data.target_labels = [student.name];
          } catch (err) {
            return showToast('فشل البحث عن الطالب', 'error');
          }
        }
        
        try {
          if (isEdit) {
            await adminAnnouncements.updateAnnouncement(announcementId, data);
          } else {
            await adminAnnouncements.createAnnouncement(data);
          }
          closeModal();
          loadAnnouncements();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    }
    
    btnCreate.addEventListener('click', () => showAnnouncementModal());
    
    init();
  </script>
</body>
</html>
