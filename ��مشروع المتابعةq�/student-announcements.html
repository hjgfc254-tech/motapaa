<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description" content="الإعلانات المدرسية - مدارس الجيل الجديد الخاصة">
  <meta name="theme-color" content="#0A2647">
  <title>الإعلانات | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    body {
      background: var(--page-bg);
      min-height: 100vh;
    }
    
    .top-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border-light);
      padding: var(--space-md) var(--space-xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    
    .top-bar-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .back-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--royal);
      text-decoration: none;
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      transition: color var(--transition-fast);
    }
    
    .back-btn:hover {
      color: var(--navy);
    }
    
    .page-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .page-header i {
      color: var(--red);
      font-size: var(--text-xl);
    }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .main-content {
      max-width: 800px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    /* رسالة توضيحية */
    .info-banner {
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      border-radius: var(--radius-lg);
      padding: var(--space-md) var(--space-lg);
      margin-bottom: var(--space-xl);
      display: flex;
      align-items: center;
      gap: var(--space-md);
      font-size: var(--text-xs);
      color: var(--info);
    }
    
    .info-banner i {
      font-size: var(--text-lg);
      flex-shrink: 0;
    }
    
    /* بطاقة إعلان */
    .announcement-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      margin-bottom: var(--space-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: all var(--transition-base);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .announcement-card:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--royal);
      transform: translateY(-2px);
    }
    
    .announcement-card.urgent {
      border-right: 4px solid var(--red);
    }
    
    .announcement-card.normal {
      border-right: 4px solid var(--royal);
    }
    
    .announcement-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--space-md);
      gap: var(--space-md);
    }
    
    .announcement-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-md);
      color: var(--ink);
      line-height: var(--leading-tight);
      flex: 1;
    }
    
    .announcement-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--weight-bold);
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .badge-urgent {
      background: var(--red-light);
      color: var(--red);
    }
    
    .badge-info {
      background: var(--royal-light);
      color: var(--royal);
    }
    
    .badge-general {
      background: var(--soft);
      color: var(--body);
    }
    
    .announcement-body {
      font-size: var(--text-sm);
      color: var(--body);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-md);
    }
    
    .announcement-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    
    .announcement-date {
      font-size: var(--text-xs);
      color: var(--mute);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }
    
    .announcement-target {
      font-size: var(--text-xs);
      color: var(--body-light);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      background: var(--soft);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
    }
    
    /* تنسيقات التحميل */
    .loading-state {
      text-align: center;
      padding: var(--space-5xl);
    }
    
    .loading-state .spinner {
      margin: 0 auto var(--space-lg);
      width: 40px;
      height: 40px;
      border-width: 4px;
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-5xl);
    }
    
    .empty-state i {
      font-size: 56px;
      color: var(--mute-light);
      margin-bottom: var(--space-lg);
      display: block;
    }
    
    .empty-state h3 {
      font-family: var(--font-heading);
      color: var(--ink);
      margin-bottom: var(--space-sm);
    }
    
    .empty-state p {
      color: var(--body-light);
      font-size: var(--text-sm);
    }
    
    /* زر تحميل المزيد */
    .load-more-container {
      text-align: center;
      padding: var(--space-xl);
    }
    
    .load-more-btn {
      padding: var(--space-md) var(--space-2xl);
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: var(--radius-full);
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      color: var(--royal);
      cursor: pointer;
      transition: all var(--transition-base);
    }
    
    .load-more-btn:hover {
      border-color: var(--royal);
      background: var(--royal-light);
    }
    
    .load-more-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    @media (max-width: 600px) {
      .top-bar {
        padding: var(--space-sm) var(--space-md);
      }
      
      .main-content {
        padding: var(--space-md);
      }
      
      .announcement-card {
        padding: var(--space-lg);
      }
      
      .announcement-title {
        font-size: var(--text-sm);
      }
      
      .announcement-card-header {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="student-dashboard.html" class="back-btn">
        <i class="fas fa-arrow-right"></i>
        العودة للوحة المتابعة
      </a>
      <div class="page-header">
        <h1>الإعلانات</h1>
        <i class="fas fa-bullhorn"></i>
      </div>
    </div>
  </header>
  
  <main class="main-content">
    <!-- رسالة توضيحية -->
    <div class="info-banner">
      <i class="fas fa-shield-halved"></i>
      <span>أنت تشاهد الإعلانات العامة والمخصصة لمرحلتك وفصلك فقط.</span>
    </div>
    
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>جاري تحميل الإعلانات...</p>
    </div>
    
    <div id="emptyState" class="empty-state" style="display:none;">
      <i class="fas fa-bullhorn"></i>
      <h3>لا توجد إعلانات</h3>
      <p>لا توجد إعلانات حالياً. سيتم عرض الإعلانات الجديدة هنا فور نشرها.</p>
    </div>
    
    <div id="announcementsList" style="display:none;">
      <!-- تُملأ ديناميكياً -->
    </div>
    
    <div class="load-more-container" id="loadMoreContainer" style="display:none;">
      <button class="load-more-btn" id="loadMoreBtn">
        <i class="fas fa-chevron-down"></i>
        عرض المزيد
      </button>
    </div>
  </main>
  
  <script type="module">
    import { authManager } from './js/auth-system.js';
    import { fetchDocuments } from './js/firebase-config.js';
    import { getCachedData, setCachedData, CACHE_CONFIG } from './js/cache-manager.js';
    import { formatDateArabic, timeAgoArabic, escapeHtml } from './js/utils.js';
    
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const announcementsList = document.getElementById('announcementsList');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    
    const PAGE_SIZE = 15;
    let currentStudent = null;
    let lastVisibleDoc = null;
    let hasMore = false;
    let isLoadingMore = false;
    
    // ===========================
    // التهيئة
    // ===========================
    async function initPage() {
      try {
        const session = await authManager.initialize();
        
        if (!session.isAuthenticated || session.type !== 'student') {
          window.location.href = 'index.html';
          return;
        }
        
        currentStudent = session.user;
        await loadAnnouncements();
        
      } catch (error) {
        console.error('❌ فشل تحميل الصفحة:', error);
        showEmptyState('حدث خطأ في تحميل الإعلانات. يرجى المحاولة لاحقاً.');
      }
    }
    
    // ===========================
    // تحميل الإعلانات
    // ===========================
    async function loadAnnouncements(loadMore = false) {
      try {
        if (!loadMore) {
          loadingState.style.display = 'block';
          announcementsList.style.display = 'none';
          emptyState.style.display = 'none';
        } else {
          isLoadingMore = true;
          loadMoreBtn.disabled = true;
          loadMoreBtn.innerHTML = '<span class="spinner spinner-sm"></span> جاري التحميل...';
        }
        
        const options = {
          orderByField: 'createdAt',
          orderDirection: 'desc',
          limitCount: PAGE_SIZE
        };
        
        if (loadMore && lastVisibleDoc) {
          options.startAfterDoc = lastVisibleDoc;
        }
        
        // جلب الإعلانات العامة فقط من Firestore (للأداء)
        // الإعلانات الموجهة تُجلب معاً وتُفلتر في المتصفح
        const result = await fetchDocuments('announcements', options);
        
        if (!result.documents || result.documents.length === 0) {
          if (!loadMore) {
            showEmptyState();
          } else {
            hasMore = false;
            loadMoreContainer.style.display = 'none';
          }
          return;
        }
        
        // فلترة الإعلانات المناسبة للطالب
        const filteredAnnouncements = filterAnnouncementsForStudent(result.documents);
        
        if (filteredAnnouncements.length === 0 && !loadMore) {
          showEmptyState();
          return;
        }
        
        // تحديث المتغيرات
        lastVisibleDoc = result.lastVisible;
        hasMore = result.hasMore;
        
        // عرض الإعلانات
        if (loadMore) {
          appendAnnouncements(filteredAnnouncements);
        } else {
          renderAnnouncements(filteredAnnouncements);
        }
        
        // إظهار/إخفاء زر تحميل المزيد
        if (hasMore && filteredAnnouncements.length > 0) {
          loadMoreContainer.style.display = 'block';
        } else {
          loadMoreContainer.style.display = 'none';
        }
        
        // إظهار المحتوى
        loadingState.style.display = 'none';
        announcementsList.style.display = 'block';
        
        // تحديث الكاش
        if (!loadMore) {
          setCachedData(CACHE_CONFIG.keys.student_announcements, filteredAnnouncements, 'student_announcements');
        }
        
      } catch (error) {
        console.error('❌ فشل تحميل الإعلانات:', error);
        if (!loadMore) {
          showEmptyState('فشل تحميل الإعلانات. تأكد من اتصالك بالإنترنت.');
        }
      } finally {
        if (loadMore) {
          isLoadingMore = false;
          loadMoreBtn.disabled = false;
          loadMoreBtn.innerHTML = '<i class="fas fa-chevron-down"></i> عرض المزيد';
        }
      }
    }
    
    // ===========================
    // فلترة الإعلانات للطالب
    // ===========================
    function filterAnnouncementsForStudent(announcements) {
      if (!currentStudent) return [];
      
      return announcements.filter(announcement => {
        const targetType = announcement.target_type;
        const targetIds = announcement.target_ids || [];
        
        // إعلان عام للكل
        if (targetType === 'all') return true;
        
        // إعلان للمرحلة
        if (targetType === 'stage' && targetIds.includes(currentStudent.stage_id)) return true;
        
        // إعلان للفصل
        if (targetType === 'class' && targetIds.includes(currentStudent.class_id)) return true;
        
        // إعلان شخصي للطالب
        if (targetType === 'student' && targetIds.includes(currentStudent.id)) return true;
        
        return false;
      });
    }
    
    // ===========================
    // عرض الإعلانات
    // ===========================
    function renderAnnouncements(announcements) {
      announcementsList.innerHTML = announcements.map(announcement => 
        createAnnouncementCard(announcement)
      ).join('');
    }
    
    function appendAnnouncements(announcements) {
      announcementsList.innerHTML += announcements.map(announcement => 
        createAnnouncementCard(announcement)
      ).join('');
    }
    
    function createAnnouncementCard(announcement) {
      const isUrgent = announcement.target_type === 'student';
      const cardClass = isUrgent ? 'urgent' : 'normal';
      
      // تطهير النصوص من XSS
      const safeTitle = escapeHtml(announcement.title || 'إعلان');
      const safeBody = escapeHtml(announcement.body || '');
      
      let badgeHTML = '';
      if (isUrgent) {
        badgeHTML = '<span class="announcement-badge badge-urgent"><i class="fas fa-exclamation-circle"></i> هام</span>';
      } else if (announcement.target_type === 'stage') {
        badgeHTML = '<span class="announcement-badge badge-info"><i class="fas fa-layer-group"></i> المرحلة</span>';
      } else if (announcement.target_type === 'class') {
        badgeHTML = '<span class="announcement-badge badge-info"><i class="fas fa-door-open"></i> الفصل</span>';
      } else {
        badgeHTML = '<span class="announcement-badge badge-general"><i class="fas fa-globe"></i> عام</span>';
      }
      
      let targetLabel = '';
      if (announcement.target_labels && announcement.target_labels.length > 0) {
        const safeLabels = announcement.target_labels.map(l => escapeHtml(l)).join('، ');
        targetLabel = `
          <span class="announcement-target">
            <i class="fas fa-users"></i>
            ${safeLabels}
          </span>
        `;
      }
      
      const createdAt = announcement.createdAt?.toDate ? announcement.createdAt.toDate() : new Date(announcement.createdAt);
      
      return `
        <div class="announcement-card ${cardClass}">
          <div class="announcement-card-header">
            <h3 class="announcement-title">${safeTitle}</h3>
            ${badgeHTML}
          </div>
          <div class="announcement-body">${safeBody}</div>
          <div class="announcement-footer">
            <div class="announcement-date">
              <i class="fas fa-clock"></i>
              <span>${timeAgoArabic(createdAt)}</span>
              <span>·</span>
              <span>${formatDateArabic(createdAt)}</span>
            </div>
            ${targetLabel}
          </div>
        </div>
      `;
    }
    
    // ===========================
    // عرض حالة فارغة
    // ===========================
    function showEmptyState(message = null) {
      loadingState.style.display = 'none';
      announcementsList.style.display = 'none';
      loadMoreContainer.style.display = 'none';
      emptyState.style.display = 'block';
      
      if (message) {
        emptyState.querySelector('p').textContent = message;
      }
    }
    
    // ===========================
    // تحميل المزيد
    // ===========================
    loadMoreBtn.addEventListener('click', () => {
      if (!isLoadingMore && hasMore) {
        loadAnnouncements(true);
      }
    });
    
    // ===========================
    // بدء التهيئة
    // ===========================
    initPage();
  </script>
</body>
</html>
