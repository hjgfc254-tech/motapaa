<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description" content="غير متصل بالإنترنت - مدارس الجيل الجديد الخاصة">
  <meta name="theme-color" content="#0A2647">
  <title>غير متصل | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #F2F5F9;
      font-family: 'Tajawal', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
    }
    
    .offline-container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    
    .offline-card {
      background: #FFFFFF;
      border-radius: 32px;
      padding: 40px 28px 32px;
      box-shadow: 0 30px 45px -15px rgba(10, 38, 71, 0.15), 0 0 0 1px rgba(10, 38, 71, 0.04);
      animation: slideUp 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #FEE2E2;
      color: #C92A2A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .offline-title {
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: #0A2647;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    
    .offline-subtitle {
      font-size: 15px;
      color: #4B5563;
      margin-bottom: 8px;
      line-height: 1.6;
    }
    
    .offline-hint {
      font-size: 13px;
      color: #9CA3AF;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    
    .offline-divider {
      width: 40px;
      height: 4px;
      background: linear-gradient(90deg, #0A2647, #1E5FBB, #C92A2A);
      border-radius: 4px;
      margin: 0 auto 28px;
    }
    
    .offline-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #1E5FBB;
      color: #FFFFFF;
      border: none;
      border-radius: 40px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 16px -4px rgba(30, 95, 187, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
    }
    
    .offline-btn:hover {
      background: #1A4F9E;
      box-shadow: 0 12px 22px -6px rgba(30, 95, 187, 0.4);
      transform: translateY(-2px);
    }
    
    .offline-btn:active {
      transform: scale(0.97);
    }
    
    .offline-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      font-size: 13px;
      color: #9CA3AF;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #C92A2A;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    .offline-footer {
      margin-top: 20px;
      font-size: 11px;
      color: #9CA3AF;
    }
    
    .offline-footer span {
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      color: #0A2647;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.08);
      }
    }
    
    @media (max-width: 400px) {
      .offline-card {
        padding: 32px 20px 24px;
      }
      
      .offline-icon {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }
      
      .offline-title {
        font-size: 20px;
      }
      
      .offline-btn {
        padding: 12px 24px;
        font-size: 14px;
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-card">
      <!-- أيقونة الاتصال -->
      <div class="offline-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <circle cx="12" cy="20" r="1"></circle>
        </svg>
      </div>
      
      <!-- العنوان -->
      <h1 class="offline-title">أنت غير متصل بالإنترنت</h1>
      
      <!-- الوصف -->
      <p class="offline-subtitle">لا يوجد اتصال بالإنترنت حالياً.</p>
      <p class="offline-hint">يرجى التحقق من اتصالك بالواي فاي أو بيانات الهاتف، ثم حاول مرة أخرى.</p>
      
      <!-- فاصل -->
      <div class="offline-divider"></div>
      
      <!-- زر إعادة المحاولة -->
      <button class="offline-btn" onclick="window.location.reload()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        إعادة المحاولة
      </button>
      
      <!-- حالة الاتصال -->
      <div class="offline-status">
        <span class="status-dot"></span>
        <span id="statusText">غير متصل</span>
      </div>
    </div>
    
    <!-- تذييل -->
    <p class="offline-footer">
      <span>مدارس الجيل الجديد الخاصة</span> © 2025
    </p>
  </div>
  
  <script>
    // ===========================
    // مراقبة حالة الاتصال
    // ===========================
    const statusDot = document.querySelector('.status-dot');
    const statusText = document.getElementById('statusText');
    const offlineIcon = document.querySelector('.offline-icon');
    const offlineTitle = document.querySelector('.offline-title');
    const offlineSubtitle = document.querySelector('.offline-subtitle');
    const retryBtn = document.querySelector('.offline-btn');
    
    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusDot.style.background = '#059669';
        statusText.textContent = 'متصل';
        statusText.style.color = '#059669';
        offlineIcon.style.background = '#ECFDF5';
        offlineIcon.style.color = '#059669';
        offlineTitle.textContent = 'تم استعادة الاتصال';
        offlineSubtitle.textContent = 'أنت متصل بالإنترنت الآن.';
        retryBtn.textContent = 'العودة للتطبيق';
        retryBtn.onclick = () => {
          window.location.href = 'index.html';
        };
        
        // العودة التلقائية بعد ثانيتين
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      } else {
        statusDot.style.background = '#C92A2A';
        statusText.textContent = 'غير متصل';
        statusText.style.color = '#9CA3AF';
        offlineIcon.style.background = '#FEE2E2';
        offlineIcon.style.color = '#C92A2A';
        offlineTitle.textContent = 'أنت غير متصل بالإنترنت';
        offlineSubtitle.textContent = 'لا يوجد اتصال بالإنترنت حالياً.';
        retryBtn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          إعادة المحاولة
        `;
        retryBtn.onclick = () => window.location.reload();
      }
    }
    
    // الاستماع لتغييرات الاتصال
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    
    // التحقق الأولي
    updateOnlineStatus();
    
    // محاولة إعادة الاتصال تلقائياً كل 10 ثواني
    setInterval(() => {
      if (!navigator.onLine) {
        // محاولة جلب ملف صغير لاختبار الاتصال
        fetch('/elgeel.png', { method: 'HEAD', cache: 'no-store' })
          .then(() => {
            if (!navigator.onLine) {
              // المتصفح لم يكتشف الاتصال بعد
              window.dispatchEvent(new Event('online'));
            }
          })
          .catch(() => {});
      }
    }, 10000);
  </script>
</body>
</html>
