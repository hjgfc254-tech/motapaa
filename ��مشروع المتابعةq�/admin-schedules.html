<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>جداول الحصص | مدارس الجيل الجديد الخاصة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    :root {
      --sidebar-width: 260px;
      --topbar-height: 64px;
    }
    
    body {
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      font-family: var(--font-body);
    }
    
    .sidebar {
      width: var(--sidebar-width);
      background: var(--navy-deep);
      color: var(--white);
      height: 100vh;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-smooth);
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    .sidebar-header {
      padding: var(--space-xl);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    
    .sidebar-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: contain;
      background: white;
      padding: 3px;
      margin: 0 auto var(--space-md);
      display: block;
    }
    
    .sidebar-school-name {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--white);
      line-height: 1.3;
    }
    
    .sidebar-school-name small {
      display: block;
      font-weight: var(--weight-regular);
      font-size: var(--text-xs);
      opacity: 0.6;
    }
    
    .sidebar-nav {
      flex: 1;
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    
    .nav-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.35);
      padding: var(--space-md) var(--space-md) var(--space-sm);
      font-weight: var(--weight-bold);
      font-family: var(--font-numbers);
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-lg);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-weight: var(--weight-medium);
      font-size: var(--text-sm);
      transition: all var(--transition-fast);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: right;
      font-family: var(--font-body);
    }
    
    .nav-item i {
      width: 22px;
      text-align: center;
      font-size: var(--text-base);
      flex-shrink: 0;
    }
    
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
    }
    
    .nav-item.active {
      background: var(--royal);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(30, 95, 187, 0.4);
    }
    
    .nav-item.danger:hover {
      background: var(--red);
      color: var(--white);
    }
    
    .sidebar-footer {
      padding: var(--space-lg);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .admin-info {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }
    
    .admin-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--royal);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--weight-bold);
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      flex-shrink: 0;
    }
    
    .admin-details {
      flex: 1;
      min-width: 0;
    }
    
    .admin-details .name {
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .admin-details .role {
      font-size: 11px;
      opacity: 0.6;
    }
    
    .main-wrapper {
      flex: 1;
      margin-right: var(--sidebar-width);
      min-height: 100vh;
    }
    
    .topbar {
      background: var(--white);
      height: var(--topbar-height);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-2xl);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-xs);
    }
    
    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }
    
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--ink);
      cursor: pointer;
      padding: var(--space-sm);
    }
    
    .page-title {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-lg);
      color: var(--navy-deep);
    }
    
    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .topbar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--soft);
      border: none;
      color: var(--body);
      cursor: pointer;
      font-size: var(--text-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      position: relative;
    }
    
    .topbar-btn:hover {
      background: var(--royal-light);
      color: var(--royal);
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      display: none;
    }
    
    .sidebar-overlay.open {
      display: block;
    }
    
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
      .main-wrapper {
        margin-right: 0;
      }
    }

    .page-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2xl);
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    
    .page-header h1 {
      font-family: var(--font-heading);
      font-weight: var(--weight-extrabold);
      font-size: var(--text-2xl);
      color: var(--navy-deep);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      border-radius: var(--radius-full);
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-base);
      border: none;
      font-family: var(--font-body);
    }
    
    .btn-primary {
      background: var(--royal);
      color: var(--white);
      box-shadow: var(--shadow-btn-blue);
    }
    
    .btn-primary:hover {
      background: var(--royal-hover);
      transform: translateY(-2px);
    }
    
    .btn-success {
      background: var(--success);
      color: var(--white);
    }
    
    .btn-danger {
      background: var(--red);
      color: var(--white);
    }
    
    .btn-outline {
      background: var(--white);
      border: 2px solid var(--border);
      color: var(--body);
    }
    
    .btn-outline:hover {
      border-color: var(--royal);
      color: var(--royal);
    }
    
    .btn-sm {
      padding: var(--space-xs) var(--space-md);
      font-size: var(--text-xs);
    }
    
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: var(--space-xl);
      overflow: hidden;
    }
    
    .card-header {
      padding: var(--space-lg) var(--space-xl);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    
    .card-header h3 {
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-md);
      color: var(--ink);
    }
    
    .card-body {
      padding: var(--space-xl);
    }
    
    .form-group {
      margin-bottom: var(--space-lg);
    }
    
    .form-group label {
      display: block;
      font-family: var(--font-heading);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      color: var(--ink);
      margin-bottom: var(--space-sm);
    }
    
    .form-input, .form-select {
      width: 100%;
      padding: var(--space-md) var(--space-lg);
      background: var(--soft);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--ink);
      transition: all var(--transition-base);
    }
    
    .form-input:focus, .form-select:focus {
      border-color: var(--border-focus);
      background: var(--white);
      box-shadow: var(--shadow-input-focus);
      outline: none;
    }
    
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    
    .schedule-table th {
      background: var(--navy-deep);
      color: var(--white);
      padding: var(--space-md) var(--space-sm);
      font-family: var(--font-heading);
      font-weight: var(--weight-bold);
      font-size: var(--text-xs);
      text-align: center;
    }
    
    .schedule-table th:first-child {
      background: var(--navy);
      width: 90px;
    }
    
    .schedule-table td {
      padding: var(--space-sm);
      border: 1px solid var(--border-light);
      text-align: center;
      vertical-align: top;
    }
    
    .schedule-table td:first-child {
      background: var(--soft);
      font-weight: var(--weight-bold);
      color: var(--navy-deep);
      font-size: var(--text-xs);
    }
    
    .schedule-table input {
      width: 100%;
      padding: var(--space-sm);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      text-align: center;
      background: var(--white);
    }
    
    .schedule-table input:focus {
      border-color: var(--royal);
      outline: none;
    }
    
    .schedule-table input.subject-input {
      font-weight: var(--weight-bold);
      color: var(--ink);
    }
    
    .schedule-table input.teacher-input {
      color: var(--body-light);
      font-size: 11px;
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-3xl);
      color: var(--mute);
    }
    
    .empty-state i {
      font-size: 40px;
      margin-bottom: var(--space-md);
      display: block;
    }
    
    .table-container {
      overflow-x: auto;
    }
    
    @media (max-width: 600px) {
      .page-container { padding: var(--space-md); }
      .page-header h1 { font-size: var(--text-xl); }
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="elgeel.png" alt="الشعار" class="sidebar-logo" onerror="this.style.display='none'">
      <div class="sidebar-school-name">
        مدارس الجيل الجديد
        <small>الخاصة</small>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <div class="nav-section-title">الرئيسية</div>
      <a class="nav-item" href="admin-dashboard.html">

      </a>
      
      <div class="nav-section-title">الإدارة</div>
      <a class="nav-item" href="admin-students.html">

      <div class="nav-section-title">المحتوى</div>
      <a class="nav-item" href="admin-events.html">

      <a class="nav-item" href="admin-gallery.html">

      <div class="nav-section-title">المالية</div>
      <a class="nav-item" href="admin-expenses.html">

      </a>

      </a>
    </nav>
    
    <div class="sidebar-footer">
      <div class="admin-info">
        <div class="admin-avatar" id="adminAvatar">م</div>
        <div class="admin-details">
          <div class="name" id="adminName">المشرف</div>
          <div class="role" id="adminRole">مدير عام</div>
        </div>
      </div>
      <button class="nav-item danger" onclick="window.location.href='admin-login.html'" style="width:100%;">
        <i class="fas fa-right-from-bracket"></i> تسجيل الخروج
      </button>
    </div>
  </aside>
  
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="page-title" id="pageTitle">جداول الحصص</h1>
      </div>
      <div class="topbar-right">
        <a href="admin-dashboard.html" class="topbar-btn" title="الرئيسية">
          <i class="fas fa-home"></i>
        </a>
      </div>
    </header>
    
    <div style="padding:var(--space-2xl);flex:1;" id="contentArea">
        <div class="page-header">
          <h1>📅 جداول الحصص</h1>
        </div>
        
        <div class="card">
          <div class="card-header">
            <h3>اختر الفصل لعرض أو تعديل جدوله</h3>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label>المرحلة</label>
              <select class="form-select" id="stageSelect">
                <option value="">اختر المرحلة</option>
              </select>
            </div>
            <div class="form-group">
              <label>الفصل</label>
              <select class="form-select" id="classSelect">
                <option value="">اختر الفصل أولاً</option>
              </select>
            </div>
            <button class="btn btn-primary" id="btnLoadSchedule">
              <i class="fas fa-search"></i> عرض الجدول
            </button>
          </div>
        </div>
        
        <div id="scheduleContainer"></div>
    </div>
  </div>
  
  <script type="module">
    import { adminSchedules, DAYS, DAY_NAMES_AR } from './js/admin-schedules.js';
    import { adminStages } from './js/admin-stages.js';
    import { showToast, escapeHtml } from './js/utils.js';
    
    // دوال تعقيم احتياطية
    const safeEscapeHtml = (str) => {
      if (typeof escapeHtml === 'function') return escapeHtml(str);
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };
    
    const escapeAttr = (str) => {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    
    const stageSelect = document.getElementById('stageSelect');
    const classSelect = document.getElementById('classSelect');
    const btnLoadSchedule = document.getElementById('btnLoadSchedule');
    const scheduleContainer = document.getElementById('scheduleContainer');
    
    let allStages = [];
    
    async function init() {
      try {
        allStages = await adminStages.getStages();
        stageSelect.innerHTML = '<option value="">اختر المرحلة</option>' + 
          allStages.map(s => `<option value="${escapeAttr(s.id)}">${safeEscapeHtml(s.name)}</option>`).join('');
      } catch (e) {
        showToast('فشل تحميل المراحل', 'error');
      }
      
      stageSelect.addEventListener('change', async () => {
        classSelect.innerHTML = '<option value="">اختر الفصل</option>';
        if (!stageSelect.value) return;
        
        try {
          const classes = await adminStages.getClasses(stageSelect.value);
          classSelect.innerHTML = '<option value="">اختر الفصل</option>' + 
            classes.map(c => `<option value="${escapeAttr(c.id)}">${safeEscapeHtml(c.name)}</option>`).join('');
        } catch (e) {
          showToast('فشل تحميل الفصول', 'error');
        }
      });
      
      btnLoadSchedule.addEventListener('click', loadSchedule);
    }
    
    async function loadSchedule() {
      const classId = classSelect.value;
      if (!classId) return showToast('اختر الفصل', 'warning');
      
      const className = classSelect.selectedOptions[0]?.text || '';
      
      try {
        const schedule = await adminSchedules.getSchedule(classId);
        renderScheduleEditor(classId, className, schedule);
      } catch (e) {
        renderScheduleEditor(classId, className, null);
      }
    }
    
    function renderScheduleEditor(classId, className, schedule) {
      const days = schedule?.days || {};
      const maxPeriods = 7;
      
      // تعقيم اسم الفصل للعرض
      const safeClassName = safeEscapeHtml(className || 'غير محدد');
      
      scheduleContainer.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h3>📋 جدول: ${safeClassName}</h3>
            <button class="btn btn-success" id="btnSaveSchedule">
              <i class="fas fa-save"></i> حفظ الجدول
            </button>
          </div>
          <div class="card-body">
            <div class="table-container">
              <table class="schedule-table">
                <thead>
                  <tr>
                    <th>الحصة</th>
                    ${DAYS.map(day => `<th>${DAY_NAMES_AR[day]}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${Array.from({length: maxPeriods}, (_, i) => `
                    <tr>
                      <td>الحصة ${i + 1}</td>
                      ${DAYS.map(day => {
                        const period = days[day]?.[i] || {};
                        // تعقيم القيم المخزنة في Firestore قبل إدراجها في value attributes
                        const safeSubject = escapeAttr(period.subject || '');
                        const safeTeacher = escapeAttr(period.teacher || '');
                        
                        return `
                          <td>
                            <input type="text" class="subject-input" placeholder="المادة" 
                              data-day="${day}" data-period="${i}" data-field="subject"
                              value="${safeSubject}">
                            <input type="text" class="teacher-input" placeholder="المعلم"
                              data-day="${day}" data-period="${i}" data-field="teacher"
                              value="${safeTeacher}">
                          </td>
                        `;
                      }).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      
      document.getElementById('btnSaveSchedule').addEventListener('click', async () => {
        const daysData = {};
        
        DAYS.forEach(day => {
          daysData[day] = [];
          for (let i = 0; i < maxPeriods; i++) {
            const subjectInput = document.querySelector(`input[data-day="${day}"][data-period="${i}"][data-field="subject"]`);
            const teacherInput = document.querySelector(`input[data-day="${day}"][data-period="${i}"][data-field="teacher"]`);
            
            const subject = subjectInput?.value?.trim() || '';
            const teacher = teacherInput?.value?.trim() || '';
            
            if (subject) {
              daysData[day].push({
                period: i + 1,
                subject,
                teacher
              });
            }
          }
        });
        
        try {
          await adminSchedules.saveSchedule(classId, className, daysData);
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    }
    
    init();
  </script>
